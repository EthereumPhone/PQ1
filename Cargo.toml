# Workspace manifest.
#
# Post-JARDÍN-cutover layout. Every crate listed here is needed to
# build the firmware (secure + nonsecure + shared + bip39 + jardin-fosc
# + sphincs-c7 + keccak-asm) or the host-side firmware measurement tool
# (fwmeasure).
#
# Intentionally NOT in the workspace:
#   * tools/ob-configurator — STM32U585 option-byte unlocker, needs a
#     different RUSTFLAGS / linker config than secure/nonsecure.
#   * tools/oled-mirror — host-side RTT framebuffer viewer.
#   * tools/*.py / *.js / *.sh — host scripts; not Rust.
[workspace]
members = [
    "shared",
    "secure",
    "nonsecure",
    "bip39",
    "fwmeasure",
    "sphincs-c7",
    "jardin-fosc",
    "keccak-asm",
    # ZK clear-sign support: BLS12-381 pairing, Merkle DB builder, standalone
    # Groth16 verifier test harness.
    "bls12_381_pka",
    "dbgen",
    "zk-test",
]
resolver = "2"

[workspace.package]
edition = "2021"

# Shared dependency versions. Member crates opt in with
# `dep = { workspace = true }` and may add features on top, but they
# cannot override the version or default-features.
[workspace.dependencies]
# Internal path deps
sphincs-tz-shared = { path = "shared" }
sphincs-tz-bip39  = { path = "bip39" }
sphincs-c7        = { path = "sphincs-c7" }
jardin-fosc       = { path = "jardin-fosc" }
keccak-asm        = { path = "keccak-asm" }
bls12_381 = { package = "bls12_381_pka", path = "bls12_381_pka", default-features = false, features = ["groups", "pairings"] }

# no_std crypto shared by `secure` + `bip39`
hmac    = { version = "0.12", default-features = false }
zeroize = { version = "1.8",  default-features = false }

# Cortex-M runtime shared by `secure` + `nonsecure`
cortex-m             = "0.7"
cortex-m-rt          = "0.7"
cortex-m-semihosting = "0.5"

hex = "0.4"

[profile.dev]
opt-level = 2

[profile.dev.package.sphincs-c7]
opt-level = 3

[profile.dev.package.jardin-fosc]
opt-level = 3

[profile.dev.package.sha3]
opt-level = 3

[profile.dev.package.keccak]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.keccak-asm]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
overflow-checks = true

[profile.release.package.sphincs-c7]
opt-level = 3

[profile.release.package.jardin-fosc]
opt-level = 3

# The keccak-f1600 permutation is the innermost loop of every SPHINCS+C11
# and JARDÍN hash call (tens of thousands per sign, 235K per JARDÍN keygen).
# These MUST be compiled for speed, not size.
[profile.release.package.sha3]
opt-level = 3

[profile.release.package.keccak]
opt-level = 3

# PBKDF2-HMAC-SHA512 runs 2048 iterations on every unlock.
[profile.release.package.sha2]
opt-level = 3

[profile.release.package.hmac]
opt-level = 3

[profile.release.package.keccak-asm]
opt-level = 3
