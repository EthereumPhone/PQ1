# Workspace manifest.
#
# Post-all-C10-cutover layout. Every crate listed here is needed to build
# the firmware (secure + nonsecure + shared + bip39 + sphincs-c10) or the
# host-side firmware measurement tool (fwmeasure). The previous per-slot
# signing crate was removed when the per-slot signing primitive switched
# from FORS+C to SPHINCS+C10.
#
# The vendored `keccak-asm` crate was dropped in the SHA-256 cutover:
# the signing stack no longer uses Keccak-f[1600]. The `sha3` crate still
# ships as a transitive dependency of `secure/` — Keccak-256 is kept for
# EIP-4337 userOpHash, EIP-712, and EIP-1559 envelope hashing because those
# are frozen by external standards, not our protocol.
#
# Intentionally NOT in the workspace:
#   * tools/ob-configurator — STM32U585 option-byte unlocker, needs a
#     different RUSTFLAGS / linker config than secure/nonsecure.
#   * tools/oled-mirror — host-side RTT framebuffer viewer.
#   * tools/*.py / *.js / *.sh — host scripts; not Rust.
[workspace]
members = [
    # Protocol IDL: single source of truth for every constant / enum /
    # wire size that crosses a TrustZone, on-chain, or USB boundary.
    # Zero-dependency by policy. Phase 3 of the modularity refactor.
    "proto",
    "shared",
    "secure",
    "nonsecure",
    "bip39",
    "fwmeasure",
    "sphincs-c10",
    # Firmware update subsystem.
    "fw-manifest",   # no_std manifest format shared by FSBL / secure / fwsign
    "fwsign",        # host-side release-signing tool
    "fsbl",          # immutable first-stage bootloader (ARM-only, no_std)
    # ZK clear-sign support: BLS12-381 pairing, Merkle DB builder, standalone
    # Groth16 verifier test harness.
    "bls12_381_pka",
    "dbgen",
    "zk-test",
    # Host-side workspace tooling (codegen, doc-checks, release packaging).
    # See `xtask/Cargo.toml` for the cargo-xtask convention. Phase 4 of the
    # modularity refactor.
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2021"

# Shared dependency versions. Member crates opt in with
# `dep = { workspace = true }` and may add features on top, but they
# cannot override the version or default-features.
[workspace.dependencies]
# Internal path deps
pqsigner-proto    = { path = "proto" }
sphincs-tz-shared = { path = "shared" }
sphincs-tz-bip39  = { path = "bip39" }
sphincs-c10       = { path = "sphincs-c10" }
fw-manifest       = { path = "fw-manifest" }
bls12_381 = { package = "bls12_381_pka", path = "bls12_381_pka", default-features = false, features = ["groups", "pairings"] }

# no_std crypto shared by `secure` + `bip39`
hmac    = { version = "0.12", default-features = false }
zeroize = { version = "1.8",  default-features = false }

# Cortex-M runtime shared by `secure` + `nonsecure`
cortex-m             = "0.7"
cortex-m-rt          = "0.7"
cortex-m-semihosting = "0.5"

hex = "0.4"

[profile.dev]
opt-level = 2

[profile.dev.package.sphincs-c10]
opt-level = 3

# PBKDF2-HMAC-SHA512 runs 2048 iterations on every unlock, and SHA-256 is
# the innermost loop of every SPHINCS+C10 hash call (both bootstrap and
# per-slot after the all-C10 cutover). These MUST be compiled for speed,
# not size.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
overflow-checks = true

[profile.release.package.sphincs-c10]
opt-level = 3

# SHA-256 (software) is the hot inner loop unless `hw-sha256` is enabled.
# Keep it at opt-level 3 even under `hw-sha256` because PBKDF2-HMAC-SHA512
# (BIP-39) always runs in software.
[profile.release.package.sha2]
opt-level = 3

[profile.release.package.hmac]
opt-level = 3
