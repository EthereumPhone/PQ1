# Workspace manifest.
#
# Post-all-C10-cutover layout. Every crate listed here is needed to build
# the firmware (secure + nonsecure + shared + bip39 + sphincs-c10) or the
# host-side firmware measurement tool (fwmeasure). The previous per-slot
# signing crate was removed when the per-slot signing primitive switched
# from FORS+C to SPHINCS+C10.
#
# The vendored `keccak-asm` crate was dropped in the SHA-256 cutover:
# the signing stack no longer uses Keccak-f[1600]. The `sha3` crate still
# ships as a transitive dependency of `secure/` — Keccak-256 is kept for
# EIP-4337 userOpHash, EIP-712, and EIP-1559 envelope hashing because those
# are frozen by external standards, not our protocol.
#
# Intentionally NOT in the workspace:
#   * (tools/ob-configurator was DELETED 2026-09-16 — issue #37: it wrote the
#     CubeProgrammer field value into the SECBOOTADD0 register, swapped the
#     SECSR/SECCR offsets, and wrote command bits to registers that do not
#     implement them. `make bootproof-hw` programs option bytes correctly via
#     STM32_Programmer_CLI; recoverable from git history if ever needed.)
#   * tools/oled-mirror — host-side RTT framebuffer viewer.
#   * tools/*.py / *.js / *.sh — host scripts; not Rust.
[workspace]
members = [
    # Protocol IDL: single source of truth for every constant / enum /
    # wire size that crosses a TrustZone, on-chain, or USB boundary.
    # Zero-dependency by policy. Phase 3 of the modularity refactor.
    "proto",
    # Frozen §5 flash-geometry registry (Draft 1.1, post-errata-4): all
    # 256 pages, exactly one owner each, const exact-once coverage
    # checks. Zero-dependency by policy (same rule as proto). FA-1.1.
    "geometry",
    # Pure no_std journal/floor core for the Draft 1.1 A/B rollback
    # architecture: FROZEN-JRN-IFACE-3 / FROZEN-OTP-API-3 / §6.2
    # decoder semantics. FA-1.3.
    "rollback",
    # Pure-logic Ethereum tx primitives (RLP, EIP-1559 envelope, U256,
    # keccak256). Phase 5 PR 5.1 of the modularity refactor.
    "tx-core",
    # ERC-4337 v0.6 UserOperation hash + EIP-1271 PersonalSign hash.
    # Phase 5 PR 5.2 of the modularity refactor.
    "aa",
    # Pure-logic key derivation, AES-GCM wrap/unwrap, BIP-39 ↔
    # SPHINCS+C10 bridge, slot-key derivation, PIN-state encoding.
    # Phase 5 PR 5.3 of the modularity refactor.
    "domain",
    # Pure-logic Solidity-ABI / ERC-20 / address-name / selector
    # trust gates. Phase 5 PR 5.4 of the modularity refactor.
    "tx",
    # ERC-7730 clear-signing descriptor interpreter (binary IR walker,
    # Merkle-bundle verifier, context-binding cross-check). Pure-logic,
    # no_std, no heap. Companion ships compiled IR + Merkle proof in a
    # trailer on every sign; this crate parses & binds it.
    "pqsigner-erc7730",
    # Trait-only HAL surface (Rng / Sha256 / Saes / Flash / Otp / Tamp
    # / ConsumptionMask / I2cBus / SpiBus / Buttons / Uart + Platform
    # aggregate + BootStage). Phase 6 PR 1 of the modularity refactor.
    # PR 2 (hal-stm32u5/) and PR 3 (hal-mock/) are deferred — see
    # `docs/archive/handoff-modularity-refactor.md` §4.2.
    "hal",
    "shared",
    "secure",
    "nonsecure",
    "bip39",
    "fwmeasure",
    "sphincs-c10",
    # ML-KEM-1024 + AES-256-GCM encrypt-to-self inner wrap for the
    # dual-SE entropy halves (Harvest-Now-Decrypt-Later defence).
    "pq-seal",
    # First-order boolean-masked SHA-256 building blocks. Measures the
    # masking overhead vs the HASH peripheral to settle the
    # SHAKE-vs-SHA2 question (work-todo §18). Pure no_std logic.
    "masked-sha2",
    # FI hardening primitives shared by `secure` and `fsbl` (sentinels,
    # check_true_into_sentinel, wait_random_loop). RNG-independent —
    # callers supply their own RNG via a closure.
    "pqsigner-fi",
    # Firmware update subsystem.
    "fw-manifest",   # no_std manifest format shared by FSBL / secure / fwsign
    "fwsign",        # host-side release-signing tool
    "fsbl",          # legacy bench first-stage bootloader (ARM-only, no_std; production-ineligible)
    "fsbl-tests",    # host-side integration tests for `fsbl` (footprint, source-text invariants)
    # Merkle DB builder (ERC-20 / names / selectors / ERC-7730 descriptors).
    "dbgen",
    # Host-side workspace tooling (codegen, doc-checks, release packaging).
    # See `xtask/Cargo.toml` for the cargo-xtask convention. Phase 4 of the
    # modularity refactor.
    "xtask",
]
# Excluded from the workspace because cargo-fuzz needs nightly +
# libFuzzer + sanitizers (separate toolchain from the firmware) and
# its `[[bin]]` entries are only meaningful to the cargo-fuzz driver.
# See `fuzz/README.md`.
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
edition = "2021"

# Single-switch workspace lint policy. Member crates opt in with
# `[lints]\nworkspace = true`. Today this only declares the custom
# `cfg` names the codebase uses so `unexpected_cfgs` stays quiet:
#   * `kani`        — bounded-model-check harnesses (`#[cfg(kani)]`)
#   * `lean_extract` — Aeneas→Lean extraction gate
# Previously each crate carried its own `[lints.rust] unexpected_cfgs`
# block (and several that use these cfgs had none, so they warned).
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(lean_extract)"] }

# Shared dependency versions. Member crates opt in with
# `dep = { workspace = true }` and may add features on top, but they
# cannot override the version or default-features.
[workspace.dependencies]
# Internal path deps
pqsigner-proto    = { path = "proto" }
pqsigner-tx-core  = { path = "tx-core" }
pqsigner-aa       = { path = "aa" }
pqsigner-domain   = { path = "domain" }
pqsigner-tx       = { path = "tx" }
pqsigner-erc7730  = { path = "pqsigner-erc7730" }
pqsigner-hal      = { path = "hal" }
sphincs-tz-shared = { path = "shared" }
sphincs-tz-bip39  = { path = "bip39", default-features = false }
sphincs-c10       = { path = "sphincs-c10" }
masked-sha2       = { path = "masked-sha2" }
fw-manifest       = { path = "fw-manifest" }
pqsigner-fi       = { path = "pqsigner-fi" }
pqsigner-pq-seal  = { path = "pq-seal" }

# no_std crypto shared by `secure` + `bip39`
hmac    = { version = "0.12", default-features = false }
zeroize = { version = "1.8",  default-features = false }

# Cortex-M runtime shared by `secure` + `nonsecure`
cortex-m             = "0.7"
cortex-m-rt          = "0.7"
cortex-m-semihosting = "0.5"

hex = "0.4"

[profile.dev]
opt-level = 2

[profile.dev.package.sphincs-c10]
opt-level = 3

# PBKDF2-HMAC-SHA512 runs 2048 iterations on every unlock, and SHA-256 is
# the innermost loop of every SPHINCS+C10 hash call (both bootstrap and
# per-slot after the all-C10 cutover). These MUST be compiled for speed,
# not size.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
overflow-checks = true

[profile.release.package.sphincs-c10]
opt-level = 3

# SHA-256 (software) is the hot inner loop unless `hw-sha256` is enabled.
# Keep it at opt-level 3 even under `hw-sha256` because PBKDF2-HMAC-SHA512
# (BIP-39) always runs in software.
[profile.release.package.sha2]
opt-level = 3

[profile.release.package.hmac]
opt-level = 3

# `micromath` provides the f32 sin/cos/sqrt/powf for the `splash-test` animated
# preview. It is the per-frame hot path there (the nebula noise field alone is
# ~46k trig calls/frame), and it is NOT linked into any production build
# (optional dep, on only under `splash-test`), so speed-optimise it
# unconditionally — no production size/repro impact.
[profile.release.package.micromath]
opt-level = 3
