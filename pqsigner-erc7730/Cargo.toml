[package]
name = "pqsigner-erc7730"
version = "0.1.0"
edition.workspace = true

# ERC-7730 clear-signing descriptor interpreter. Owns the on-device
# binary IR (the host compiler in `dbgen` is the canonical writer; this
# crate is the canonical reader), the Merkle-trailer verifier that
# binds an IR blob to the firmware-pinned `ERC7730_DESCRIPTORS_ROOT`,
# and the context cross-check that proves the descriptor applies to
# the transaction (or EIP-712 payload) actually being signed.
#
# Pure-logic, no_std, no heap. Re-exported into the secure crate via
# `secure/src/tx/erc7730.rs` and consumed by `cmd_sign_userop`,
# `cmd_sign_userop_batch`, and `cmd_sign_offchain`.
#
# The full display renderer and its page substrate now live in
# `pqsigner-erc7730/src/display/`; secure world calls the same host-linkable,
# fuzzable implementation through a thin re-export. Hardware UI backends stay
# in the secure crate.

[dependencies]
pqsigner-proto    = { workspace = true }
pqsigner-tx       = { workspace = true }
pqsigner-tx-core  = { workspace = true }
sha2 = { version = "0.11", default-features = false }
sha3 = { version = "0.10", default-features = false }
subtle = { version = "2.6", default-features = false }

[features]
# Bring-up-only: renders a preceding "DEV UNATTESTED" warning page before the
# intent banner (see `display::render::intent`). The secure crate propagates its
# own `erc7730-dev-unattested` feature to this one; mutually exclusive with
# `mode-production` (a `compile_error!` in the secure `nsc/mod.rs`).
erc7730-dev-unattested = []
# Test/QEMU only: activates the exact synthetic `forward(address,bytes)`
# nested-calldata policy row. Ordinary and production builds keep an empty
# admission table; this is compile-time policy, never a host-supplied runtime
# switch.
nested-calldata-test-fixture = []

[dev-dependencies]
hex = { workspace = true }

[lints]
workspace = true
