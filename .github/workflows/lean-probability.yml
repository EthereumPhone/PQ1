name: Lean FV (C10 probability)

# Separate research project; the mathlib-free lean/ project does not import it.
on:
  push:
    branches: [master]
    paths: &probability_paths
      - 'contracts/verification/probability/**'
      - 'contracts/verification/scripts/check_probability.py'
      - 'contracts/verification/scripts/probability_execution.py'
      - 'contracts/verification/scripts/test_probability_execution.py'
      - 'contracts/verification/scripts/probability_reuse.py'
      - 'contracts/verification/scripts/test_probability_reuse.py'
      - 'scripts/gate_enforcement.json'
      - 'contracts/verification/scripts/probability_controls.py'
      - 'contracts/verification/scripts/check_axiom_closure.py'
      - 'contracts/verification/scripts/check_ledger_consistency.py'
      - 'contracts/verification/Makefile'
      - '.github/workflows/lean-probability.yml'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/NodeQueryDomain.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/C10Counter.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/C10RawGrind.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/RawWots.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/WotsAcceptanceMass.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/C10Encoding.ec'
      - 'sphincs-c10/src/wots.rs'
      - 'sphincs-c10/src/fors.rs'
      - 'sphincs-c10/src/hash.rs'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/C10RawOracle.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/C10Randomizer.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/C10HashDomains.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/SecretPrefix.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/PrefixGuess.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/PrefixHybrid.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/PrefixGames.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/PrefixIdeal.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/PrefixState.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/RawKeygen.ec'
      - 'sphincs-c10/src/address.rs'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/KeygenPrefixes.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/RawShuffle.ec'
      - 'sphincs-c10/src/shuffle.rs'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/RawMerkle.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/RawFors.ec'
      - 'sphincs-c10/src/merkle.rs'
      - 'sphincs-c10/src/params.rs'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/RawForest.ec'
      - 'sphincs-c10/src/hypertree.rs'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/RawLayer.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/RawSigner.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/KeygenExhaustion.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/RoleGrind.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/FullSession.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/RawSignature.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/ByteGameTopExtraction.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/ForsBuilderSecret.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/RootCoverage.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/RawMerkleRootWitness.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/RawForsComparison.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/RawPathComparison.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/PathCollision.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/PathReplay.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/ClientQueryDriver.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/ClientQueryLog.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/ExposureAccounting.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/ExposureSupport.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/ExposureDriver.ec'
      - 'contracts/verification/easycrypt/c10-port/cdrafts-split/ExposureLog.ec'
  pull_request:
    paths: *probability_paths
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    name: PR control reuse eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      candidate: ${{ steps.select.outputs.candidate }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: install elan (toolchain pinned by lean-toolchain)
        if: ${{ github.event_name == 'push' && vars.PROBABILITY_FORCE_COLD != 'true' }}
        run: |
          # Pinned + verified, not `curl | sh` from a moving branch. `master`
          # is mutable: whoever controls that ref controls the toolchain
          # installer on every FV runner, which is the trust root the
          # verification Makefile builds on. Pin the commit, check the bytes,
          # and only then execute. (#562)
          set -euo pipefail
          ELAN_REF=464c9d28395000a2a0128e07081e4956d50eced2
          ELAN_SHA256=a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://raw.githubusercontent.com/leanprover/elan/${ELAN_REF}/elan-init.sh" \
            -o elan-init.sh
          echo "${ELAN_SHA256}  elan-init.sh" | sha256sum -c -
          sh elan-init.sh -y --default-toolchain none
          rm -f elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: require no dependency cache
        if: ${{ github.event_name == 'push' && vars.PROBABILITY_FORCE_COLD != 'true' }}
        run: test ! -e contracts/verification/probability/.lake/packages
      - name: fetch pinned mathlib probability cache
        if: ${{ github.event_name == 'push' && vars.PROBABILITY_FORCE_COLD != 'true' }}
        working-directory: contracts/verification/probability
        run: |
          lake exe cache get Mathlib.Algebra.BigOperators.Fin Mathlib.Analysis.SpecificLimits.Basic Mathlib.Data.ENNReal.BigOperators Mathlib.Data.Fin.Tuple.Basic Mathlib.Tactic.NormNum Mathlib.Topology.Algebra.InfiniteSum.ENNReal Mathlib.Combinatorics.Enumerative.Stirling Mathlib.Data.Fin.Tuple.Embedding Mathlib.Data.Fintype.BigOperators Mathlib.Data.Fintype.CardEmbedding Mathlib.Data.List.Forall2 Mathlib.Data.List.OfFn Mathlib.Data.Nat.Choose.Basic Mathlib.Logic.Equiv.Fin.Basic Mathlib.Probability.Distributions.Uniform Mathlib.Probability.ProbabilityMassFunction.Constructions Mathlib.Tactic
          lake build proofwidgets/widgetJsAll
      - name: select eligible original run
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PROBABILITY_FORCE_COLD: ${{ (vars.PROBABILITY_FORCE_COLD == 'true' || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
          PROBABILITY_OUTPUT: ${{ runner.temp }}/probability-probe
        run: /usr/bin/python3 -E -S contracts/verification/scripts/check_probability.py --reuse-probe

  controls:
    needs: [probe]
    if: ${{ always() && (needs.probe.result != 'success' || needs.probe.outputs.candidate == '') }}
    name: PMF controls (${{ matrix.index }}/${{ matrix.count }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {count: 8, index: 0}
          - {count: 8, index: 1}
          - {count: 8, index: 2}
          - {count: 8, index: 3}
          - {count: 8, index: 4}
          - {count: 8, index: 5}
          - {count: 8, index: 6}
          - {count: 8, index: 7}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: install elan (toolchain pinned by lean-toolchain)
        run: |
          # Pinned + verified, not `curl | sh` from a moving branch. `master`
          # is mutable: whoever controls that ref controls the toolchain
          # installer on every FV runner, which is the trust root the
          # verification Makefile builds on. Pin the commit, check the bytes,
          # and only then execute. (#562)
          set -euo pipefail
          ELAN_REF=464c9d28395000a2a0128e07081e4956d50eced2
          ELAN_SHA256=a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://raw.githubusercontent.com/leanprover/elan/${ELAN_REF}/elan-init.sh" \
            -o elan-init.sh
          echo "${ELAN_SHA256}  elan-init.sh" | sha256sum -c -
          sh elan-init.sh -y --default-toolchain none
          rm -f elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: require no dependency cache
        run: test ! -e contracts/verification/probability/.lake/packages
      - name: fetch pinned mathlib probability cache
        working-directory: contracts/verification/probability
        run: |
          lake exe cache get Mathlib.Algebra.BigOperators.Fin Mathlib.Analysis.SpecificLimits.Basic Mathlib.Data.ENNReal.BigOperators Mathlib.Data.Fin.Tuple.Basic Mathlib.Tactic.NormNum Mathlib.Topology.Algebra.InfiniteSum.ENNReal Mathlib.Combinatorics.Enumerative.Stirling Mathlib.Data.Fin.Tuple.Embedding Mathlib.Data.Fintype.BigOperators Mathlib.Data.Fintype.CardEmbedding Mathlib.Data.List.Forall2 Mathlib.Data.List.OfFn Mathlib.Data.Nat.Choose.Basic Mathlib.Logic.Equiv.Fin.Basic Mathlib.Probability.Distributions.Uniform Mathlib.Probability.ProbabilityMassFunction.Constructions Mathlib.Tactic
          lake build proofwidgets/widgetJsAll
      - name: runner regression controls
        run: |
          /usr/bin/python3 -E -S contracts/verification/scripts/test_probability_execution.py
          /usr/bin/python3 -E -S contracts/verification/scripts/test_probability_reuse.py
      - name: fresh proof build and control shard
        env:
          PROBABILITY_SHARD_INDEX: ${{ matrix.index }}
          PROBABILITY_SHARD_COUNT: ${{ matrix.count }}
          PROBABILITY_OUTPUT: ${{ runner.temp }}/probability-shard
        run: /usr/bin/python3 -E -S contracts/verification/scripts/check_probability.py
      - name: preserve shard evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: probability-${{ matrix.count }}-${{ matrix.index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/probability-shard
          if-no-files-found: error
          retention-days: 7

  probability:
    name: PMF proofs and semantic controls
    needs: [probe, controls]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        count: [8]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: require cold or reuse dependency state
        env:
          PROBE_RESULT: ${{ needs.probe.result }}
          CANDIDATE: ${{ needs.probe.outputs.candidate }}
          PRODUCER_RESULT: ${{ needs.controls.result }}
        run: |
          /usr/bin/python3 -E -S - <<'PYCODE'
          import os, sys
          sys.path.insert(0, 'contracts/verification/scripts')
          from probability_reuse import final_route
          print(final_route(os.environ['PROBE_RESULT'], os.environ['CANDIDATE'], os.environ['PRODUCER_RESULT']))
          PYCODE
      - name: install elan (toolchain pinned by lean-toolchain)
        run: |
          # Pinned + verified, not `curl | sh` from a moving branch. `master`
          # is mutable: whoever controls that ref controls the toolchain
          # installer on every FV runner, which is the trust root the
          # verification Makefile builds on. Pin the commit, check the bytes,
          # and only then execute. (#562)
          set -euo pipefail
          ELAN_REF=464c9d28395000a2a0128e07081e4956d50eced2
          ELAN_SHA256=a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://raw.githubusercontent.com/leanprover/elan/${ELAN_REF}/elan-init.sh" \
            -o elan-init.sh
          echo "${ELAN_SHA256}  elan-init.sh" | sha256sum -c -
          sh elan-init.sh -y --default-toolchain none
          rm -f elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: require no dependency cache
        run: test ! -e contracts/verification/probability/.lake/packages
      - name: fetch pinned mathlib probability cache
        working-directory: contracts/verification/probability
        run: |
          lake exe cache get Mathlib.Algebra.BigOperators.Fin Mathlib.Analysis.SpecificLimits.Basic Mathlib.Data.ENNReal.BigOperators Mathlib.Data.Fin.Tuple.Basic Mathlib.Tactic.NormNum Mathlib.Topology.Algebra.InfiniteSum.ENNReal Mathlib.Combinatorics.Enumerative.Stirling Mathlib.Data.Fin.Tuple.Embedding Mathlib.Data.Fintype.BigOperators Mathlib.Data.Fintype.CardEmbedding Mathlib.Data.List.Forall2 Mathlib.Data.List.OfFn Mathlib.Data.Nat.Choose.Basic Mathlib.Logic.Equiv.Fin.Basic Mathlib.Probability.Distributions.Uniform Mathlib.Probability.ProbabilityMassFunction.Constructions Mathlib.Tactic
          lake build proofwidgets/widgetJsAll
      - name: download this attempt's shard evidence
        if: ${{ needs.controls.result == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: probability-${{ matrix.count }}-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/probability-downloads
      - name: require exact artifact set
        if: ${{ needs.controls.result == 'success' }}
        env:
          SHARD_COUNT: ${{ matrix.count }}
          ATTEMPT: ${{ github.run_attempt }}
          INCOMING: ${{ runner.temp }}/probability-downloads
          RECEIPTS: ${{ runner.temp }}/probability-receipts
        run: |
          /usr/bin/python3 -E -S - <<'PY'
          import os
          from pathlib import Path
          count = int(os.environ['SHARD_COUNT'])
          attempt = os.environ['ATTEMPT']
          incoming, receipts = Path(os.environ['INCOMING']), Path(os.environ['RECEIPTS'])
          expected = {f'probability-{count}-{i}-{attempt}' for i in range(count)}
          if {p.name for p in incoming.iterdir()} != expected:
              raise SystemExit('missing or unexpected artifact')
          receipts.mkdir()
          for i in range(count):
              (incoming / f'probability-{count}-{i}-{attempt}').rename(receipts / f'shard-{i}')
          PY
      - name: runner regression controls
        run: |
          /usr/bin/python3 -E -S contracts/verification/scripts/test_probability_execution.py
          /usr/bin/python3 -E -S contracts/verification/scripts/test_probability_reuse.py
      - name: verify-probability (fresh kernel build, claims and typed controls)
        env:
          GH_TOKEN: ${{ github.token }}
          PROBABILITY_CI_FINAL: 'true'
          PROBABILITY_PROBE_RESULT: ${{ needs.probe.result }}
          PROBABILITY_REUSE_RUN: ${{ needs.controls.result == 'skipped' && needs.probe.outputs.candidate || '' }}
          PROBABILITY_FORCE_COLD: ${{ (vars.PROBABILITY_FORCE_COLD == 'true' || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
          PROBABILITY_AGGREGATE: ${{ needs.controls.result == 'success' && format('{0}/probability-receipts', runner.temp) || '' }}
          PROBABILITY_SHARD_COUNT: ${{ matrix.count }}
          PROBABILITY_PRODUCER_RESULT: ${{ needs.controls.result }}
          PROBABILITY_OUTPUT: ${{ runner.temp }}/probability-aggregate
        run: make -C contracts/verification verify-probability
      - name: preserve aggregate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: probability-aggregate-${{ matrix.count }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/probability-aggregate
          if-no-files-found: error
          retention-days: 7
