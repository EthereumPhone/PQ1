name: Lean FV (SphincsCVerify)

# CI gate for the Lean formal-verification suite. Until 2026-06-18 NONE of the
# `lake`/`elan` verify-* checks ran in CI (the main ci.yml `paths-ignore`s
# `**/*.lean` + `contracts/verification/**`), so the kernel axiom-cleanliness, the
# H-2/H-3 axiom-closure gates, and the 0-`sorry` discipline were review-time only.
# This dedicated workflow uses a POSITIVE `paths:` filter so it runs exactly when the
# Lean sources / scripts change, and enforces:
#   * `lake build SphincsCVerify` — 0 errors, 0 `sorry` (the kernel rejects either).
#   * `verify-fv-lints` — the four FV-invariant sub-lints, incl. the EXACT-set
#     theft_free (c.2) + offchain (c.1) axiom-closure tripwires and the opaque-guard.
#   * `verify-audit` — sorry count + the #print-axioms dump (theft_free = exactly its
#     11 documented axioms; execC10Asm_eq / deployed_verifier_refines_spec gated).
#
# SCOPE: `SphincsCVerify` is MATHLIB-FREE, so this needs only elan + a `lake` build
# (no multi-GB mathlib cache). The `extracted/` (§33 Aeneas) project DOES import
# mathlib (different toolchain) and is gated by the sibling `lean-extracted.yml`
# workflow (heavier: pins v4.30 + pulls the prebuilt mathlib cache).
# The build includes high-heartbeat lemmas (Interpreter/Phases.lean), so it is slow;
# the `.lake` cache amortizes unchanged modules across runs.

on:
  push:
    branches: [master]
    paths:
      - 'contracts/verification/lean/**'
      - 'contracts/verification/scripts/**'
      # Ledger/assurance docs: so verify-ledger-consistency actually FIRES on
      # AXIOM_STATUS.json-only edits (FV adversarial-review F1, 2026-07-01 —
      # these edits previously matched no positive path and were path-ignored
      # by ci.yml, so the gate advertised to police ledger drift never ran).
      - 'contracts/verification/docs/**'
      - 'contracts/verification/Makefile'
      - '.github/workflows/lean-fv.yml'
      # Extracted §33 tree: verify-fv-lints' escape-hatch/opaque-guard grep scans
      # extracted/Extracted/ too (lint_fv_invariants.sh:77,151), but this workflow
      # never TRIGGERED on extracted-only edits — so a native_decide/@[extern]/new-axiom
      # in an extracted rank merged unscanned (extracted-F2, V10, 2026-07-02). The build
      # leg stays lean/-only; the lints scan the extracted sources as files.
      - 'contracts/verification/extracted/Extracted/**'
  pull_request:
    paths:
      - 'contracts/verification/lean/**'
      - 'contracts/verification/scripts/**'
      # Ledger/assurance docs (FV review F1) — see the push trigger above.
      - 'contracts/verification/docs/**'
      - 'contracts/verification/Makefile'
      - '.github/workflows/lean-fv.yml'
      # Extracted §33 escape-hatch scan (extracted-F2) — see the push trigger above.
      - 'contracts/verification/extracted/Extracted/**'

permissions:
  contents: read

concurrency:
  group: lean-fv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean-fv:
    name: lake build + FV-lints + axiom audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: install elan (toolchain pinned by lean-toolchain)
        run: |
          # Pinned + verified, not `curl | sh` from a moving branch. `master`
          # is mutable: whoever controls that ref controls the toolchain
          # installer on every FV runner, which is the trust root the
          # verification Makefile builds on. Pin the commit, check the bytes,
          # and only then execute. (#562)
          set -euo pipefail
          ELAN_REF=464c9d28395000a2a0128e07081e4956d50eced2
          ELAN_SHA256=a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://raw.githubusercontent.com/leanprover/elan/${ELAN_REF}/elan-init.sh" \
            -o elan-init.sh
          echo "${ELAN_SHA256}  elan-init.sh" | sha256sum -c -
          sh elan-init.sh -y --default-toolchain none
          rm -f elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: cache .lake build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: contracts/verification/lean/.lake/build
          key: lean-fv-lake-${{ hashFiles('contracts/verification/lean/lean-toolchain', 'contracts/verification/lean/lakefile.toml') }}-${{ hashFiles('contracts/verification/lean/SphincsCVerify/**/*.lean') }}
          restore-keys: |
            lean-fv-lake-${{ hashFiles('contracts/verification/lean/lean-toolchain', 'contracts/verification/lean/lakefile.toml') }}-
            lean-fv-lake-
      - name: lake build SphincsCVerify (0 errors / 0 sorry)
        run: cd contracts/verification/lean && lake build SphincsCVerify
      - name: verify-fv-lints (axiom-closure exact-set + opaque-guard + escape-hatch)
        run: make -C contracts/verification verify-fv-lints
      - name: verify-audit (sorry count + #print axioms dump)
        run: make -C contracts/verification verify-audit
      - name: verify-ledger-consistency (AXIOM_STATUS.json falsifiable vs live dump)
        # Cheap given the build above: re-runs the dump + cross-checks the advertised
        # closures / signature-pins / counts / no-undocumented-axiom / C9 witness
        # coverage against the live Lean truth + the lint_fv pin. Ships its own
        # --self-test negative control (asserted first). The SLOW sibling
        # verify-proof-mutation runs in nightly.yml, not here.
        # GitHub Runner launches the setuid sudo binary directly as the custom
        # shell, before any caller-influenced Bash or dynamic loader can suppress
        # the body. sudo immediately drops back to the hosted runner account and
        # env -i starts the only Bash. `exec` preserves sudo as the launcher's
        # parent, which the launcher verifies before requiring the exact receipt.
        shell: /usr/bin/sudo -n -u runner -- /usr/bin/env -i /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
        run: |
          exec /usr/bin/bash --noprofile --norc -p \
            contracts/verification/scripts/run_authoritative_make.sh \
            make -C contracts/verification verify-ledger-consistency
      - name: verify-storage-mutators (I-3 closed-world — no unverified cap-counter mutator)
        # Grep-based closed-world lint (no build) — was UNWIRED (FV review, 2026-07-01):
        # reachable_implies_combinedCap / no_reset_path are sound only if the
        # Reachable/no-decrease constructors are the COMPLETE set of Storage
        # mutators; a new resetter added to Storage.lean would type-check green
        # beside them. No other gate (closures/ledger/proof-mutation) can catch it.
        run: make -C contracts/verification verify-storage-mutators
