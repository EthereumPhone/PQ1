name: CI

# Born-green CI for PQSigner. Each job runs a command verified to pass on the
# current tree (2026-06-16). The two pre-existing reds tracked in earlier
# revisions of this file are now FIXED and GATED here (docs/archive/work-todo-retired-2026-07-19.md §34):
#   * usb_hw raw-MMIO source-pin (commit 4d1d6476 — raw read/write_volatile
#     migrated to hw::mmio::Reg32). Gated by the `secure-tests` job (the full
#     sphincs-tz-secure host suite: 2076 passed / 0 failed on this tree).
#   * The `contracts` job was dying at COMPILE time in CI: the Foundry libs
#     (forge-std, solady, account-abstraction, …) are git-pinned by
#     contracts/smart-wallet/foundry.lock, but `lib/` is gitignored and they
#     are NOT git submodules — so a clean CI checkout had nothing to compile
#     against ("Unable to resolve imports"). The job now restores each lib at
#     its EXACT foundry.lock rev, then runs the full default `forge test`
#     (109 passed / 0 failed / 1 skipped — the skip is DeployedBytecodeReproCheck,
#     which only runs under the deploy profile). The committed codehash pins
#     (0xf1ef… verifier, 0x43c654… wallet) are canonical for exactly this
#     foundry.lock lib set; an extra/missing lib perturbs solc metadata and
#     therefore the codehash, so the restore must be lib-exact.
#
# Intentionally NOT in CI (kept as local/manual gates — slow + need the
# patched halmos toolchain): the `deploy` foundry profile (runs=999999) and
# `make -C contracts/verification verify-bytecode` (the symbolic discharge).
# Under the deploy profile DeployedBytecodeReproCheck reproduces the on-chain
# Base Mainnet bytecode exactly (verified locally in a clean lib-exact tree).

on:
  push:
    branches: [master]
  # Documentation is executable review input: research bundles are generated
  # from Markdown and are drift-checked by `check-codegen`. Do not add a
  # docs-only path exclusion without a separate always-on bundle-drift job.
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariant-gates:
    name: Invariant gates (#5 / #6 / #7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: install elan shim (verification Makefile trust root)
        run: |
          # Pinned + verified, not `curl | sh` from a moving branch. `master`
          # is mutable: whoever controls that ref controls the toolchain
          # installer on every FV runner, which is the trust root the
          # verification Makefile builds on. Pin the commit, check the bytes,
          # and only then execute. (#562)
          set -euo pipefail
          ELAN_REF=464c9d28395000a2a0128e07081e4956d50eced2
          ELAN_SHA256=a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://raw.githubusercontent.com/leanprover/elan/${ELAN_REF}/elan-init.sh" \
            -o elan-init.sh
          echo "${ELAN_SHA256}  elan-init.sh" | sha256sum -c -
          sh elan-init.sh -y --default-toolchain none
          rm -f elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # Deterministic supply-chain gate (fail-hard):
      #  * bans       — invariant #5: no classical-signer crate (deny.toml [bans])
      #  * advisories — real CVEs in any dep (unmaintained is workspace-scoped per
      #                 deny.toml so transitive-unmaintained deps don't tripwire CI)
      #  * sources    — deps only from expected registries/remotes (typosquat /
      #                 dependency-confusion guard)
      # Licenses are deliberately NOT a hard gate (a compliance tripwire, not a
      # security property) — captured by the SBOM (`make sbom`) instead.
      - name: cargo deny check (advisories + bans + sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans sources
      # Cargo-deny has no parent-scoped exceptions. Pin the sole host-only
      # dbgen -> k256 -> ecdsa verification edge and prove it is absent from
      # every non-host normal/build graph before running source rules.
      - name: Host-only ERC-8176 classical-verifier boundary
        run: make classical-crypto-boundary
      # Invariants #5/#6/#7 (source level): the hard ERROR rules must be clean.
      - name: semgrep invariant rules (ERROR-level)
        run: |
          python3 -m pip install --quiet semgrep==1.167.0
          semgrep --config .semgrep/pqsigner-invariants.yml --severity ERROR --error --metrics off
      # A3.1 transcription-fidelity gate: the deployed verifier SOURCE
      # (SPHINCsC10Asm.sol) and its Lean hand transcription (c10Program) must not
      # drift. Positional constant cross-check (per `-- L<n>` anchors) + global set
      # equality + statement-kind histogram. The checker is pure Python; the
      # elan shim above satisfies the shared fail-closed Makefile trust-root
      # preflight without running a Lean build. This is the ONE A3.1 residual
      # the kernel proof `execC10Asm_eq` cannot see (it relates
      # c10Program<->spec, never c10Program<->.sol). See
      # contracts/verification/docs/findings/A3_1_ADVERSARIAL_REVIEW_2026-06-18.md.
      - name: A3.1 c10Program <-> SPHINCsC10Asm.sol transcription lint
        run: make -C contracts/verification verify-transcription
      # HW-ASSUME ledger hygiene. Deliberately here and NOT in lean-fv.yml: that
      # workflow's path filter watches contracts/verification/** only, but this
      # gate's C3 check anchors into secure/, shared/, hal/ and the Makefiles —
      # so hosted there it would be path-ignored by exactly the edits that break
      # it. That is the FV adversarial-review F1 failure mode (a gate advertised
      # to police drift that never fires) and this job has no path filter, so it
      # always runs. Pure source inspection: no Lean build. Ships its own
      # --self-test negative control (asserted first).
      - name: HW-ASSUME ledger falsifiable (anchors / real tests / bidirectional ids)
        run: make -C contracts/verification verify-hw-assumptions
      # Frozen Draft 1.1/1.2 rollback pair. Those docs are reviewed at an exact
      # digest and the 2026-07-26 ratification says any byte change reopens the
      # gate -- but nothing enforced it, so `fb66a1e5`'s HW-CONFIRM->HW-ASSUME
      # rename silently reopened a ratified gate and went unnoticed for six days
      # (found only by hand-hashing during an unrelated review). Hosted HERE and
      # not in lean-fv.yml for the same reason as the gate above: its inputs are
      # docs/security/**, which that workflow's contracts/verification/** path
      # filter would ignore -- i.e. it would be silenced by exactly the commits
      # that break it. This job has no path filter. Pure digest inspection, no
      # Lean build. Green here means the bytes match the receipt; it asserts
      # NOTHING about whether those bytes are approved.
      - name: Rollback Draft 1.1/1.2 frozen-pair digest pin
        run: make -C contracts/verification verify-rollback-freeze-pin
      # C2 (MMIO bases vs ST's CMSIS header) is NOT here: it SKIP-exits 0 when
      # STM32CubeU5 is absent (never on CI runners), so as a CI step it was a
      # permanent green no-op asserting nothing (F51). It is a real LOCAL gate —
      # `make verify-mmio-addresses` on any box with the vendor SDK — declared
      # local_documented in scripts/gate_enforcement.json.

  supply-chain-vet:
    name: cargo-vet (dependency audit attestation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Every dep must be trusted-audited (imported audit sets, pinned in
      # supply-chain/imports.lock) or exempted in supply-chain/config.toml; a
      # new unaudited transitive dep fails here. rust-cache caches the built
      # cargo-vet binary so this is fast after the first run.
      - name: cargo install cargo-vet
        run: cargo install --locked cargo-vet
      - name: cargo vet --locked
        run: cargo vet --locked

  prod-config-gate:
    name: Production quarantine gates (rollback + ERC-7730 provenance OPEN)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: thumbv8m.main-none-eabi
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Production is intentionally unavailable until the reviewed rollback
      # backend, resource gates, and later owner-authorized silicon receipts
      # close. CI is green only when the canonical ship gate fails for this
      # exact reason; an unexpected PASS or unrelated failure is a CI failure.
      - name: prove prod-check-ship is quarantined
        shell: bash
        run: |
          set -euo pipefail
          if output="$(make prod-check-ship 2>&1)"; then
            printf '%s\n' "$output"
            echo "ERROR: production gate unexpectedly passed"
            exit 1
          fi
          printf '%s\n' "$output"
          grep -Fq "prod-feature-check: PASS" <<<"$output"
          grep -Fq "reviewed production rollback backend is not implemented" <<<"$output"
      - name: execute rollback quarantine negative tests
        run: cargo test --locked -p pqsigner-fsbl-tests --test rollback_ship_fences
      - name: execute ERC-7730 provenance quarantine negative tests
        run: cargo test --locked -p pqsigner-fsbl-tests --test erc7730_provenance_fences
      # Keep catalogue provenance separately observable from the rollback
      # refusal above. CI accepts only the exact dev-unattested failure; a
      # surprise PASS or unrelated descriptor-generation failure is RED.
      - name: prove ERC-7730 production provenance is quarantined
        shell: bash
        run: |
          set -euo pipefail
          if output="$(make prod-erc7730-provenance-check 2>&1)"; then
            printf '%s\n' "$output"
            echo "ERROR: ERC-7730 production provenance unexpectedly passed"
            exit 1
          fi
          printf '%s\n' "$output"
          grep -Fq "prod-erc7730-provenance-check: FAIL" <<<"$output"
          grep -Fq "catalogue provenance is 'dev-unattested'" <<<"$output"
          grep -Fq "required 'erc8176-verified'" <<<"$output"

  host-tests:
    name: Host unit tests (pure-logic crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # `--tests` (NOT `--lib`): run each crate's integration suites in tests/
      # as well as its in-crate unit tests. The tests/ dirs hold almost all of
      # the frozen-wire-format, KDF-tag-stability, and RAW32-forgery-oracle
      # regression assertions — `--lib` silently skipped every one of them, so
      # they went completely un-run in CI until this was fixed (2026-07-02; the
      # switch immediately surfaced a stale proto max-input-len assertion that
      # had drifted when the v0x03 nested-EIP-712 path landed). fsbl-tests is
      # deliberately excluded here — its footprint test cross-compiles to
      # thumbv8m and belongs in a firmware-target job, not this host job.
      - name: cargo test (pure-logic crates)
        run: |
          cargo test --locked --tests \
            -p pqsigner-proto -p pqsigner-tx-core -p pqsigner-aa \
            -p pqsigner-domain -p pqsigner-tx -p pqsigner-erc7730 \
            -p sphincs-c10 -p pqsigner-fi \
            -p sphincs-tz-bip39 -p fw-manifest -p sphincs-tz-shared \
            -p pqsigner-hal -p pqsigner-pq-seal -p masked-sha2 -p pqsigner-xtask \
            -p fwsign -p fwmeasure
      # Keep the host-only fsbl-tests suites enrolled explicitly.
      # The whole fsbl-tests crate stays out of this job because its footprint
      # suite cross-compiles the real FSBL; these named suites have no Thumb or
      # hardware dependency and must not silently disappear from CI. F42:
      # source_invariants (render-before-branch trust chain, verify_images
      # digest type, NV3007 constants, measured_boot self-attest pins) was
      # green-when-run but enrolled in NO CI job until now.
      - name: fsbl-tests host-only suites (rollback models + source invariants)
        run: |
          cargo test --locked -p pqsigner-fsbl-tests \
            --lib \
            --test draft09_floor_stage_model \
            --test draft09_codec_candidates \
            --test draft09_resource_envelope \
            --test draft11_deletion_experiments \
            --test source_invariants
      # ERC-7730 descriptor catalog gate: (1) the firmware-pinned
      # `ERC7730_DESCRIPTORS_ROOT` in secure/src/db_roots.rs must match a
      # fresh dbgen build — catches a forgotten `cargo run -p dbgen` after a
      # descriptor edit (a stale root would silently fail closed on-device);
      # (2) every compiled IR re-parses through the on-device parser and its
      # Merkle proof re-verifies. Targets exist locally as
      # `make check-erc7730-descriptors`; wired here so the catalog can never
      # drift on merge.
      - name: ERC-7730 descriptor catalog in-sync (drift gate)
        run: make check-erc7730-descriptors
      # Deterministic/offline: malformed, revoked, and expired EAS rows must
      # never contribute to a descriptor's trusted-attester threshold.
      - name: ERC-8176 coverage checker regressions (offline)
        run: make erc8176-coverage-test
      # proto -> Solidity freshness: PqsignerProto.sol must be a byte-for-byte
      # render of the current proto constants (the on-chain verifier depends on
      # them). This gate was claimed in xtask help + Natspec but wired nowhere
      # until 2026-07-02.
      - name: proto -> Solidity constants in-sync (PqsignerProto.sol drift)
        run: make check-solidity-constants
      - name: security research bundles in-sync (drift gate)
        run: |
          python3 -m pip install --quiet markdown-it-py==3.0.0
          make check-research-bundles
      - name: ERC-7730 dbgen tests (policy/includes + round-trip)
        run: |
          cargo test --locked -p dbgen --tests
          cargo test --locked -p dbgen \
            --features nested-calldata-test-fixture \
            --test erc7730_nested_calldata_fixture \
            --test erc7730_roundtrip
      - name: ERC-7730 / ERC-8213 independent parity gate
        run: |
          python -m pip install --quiet uv==0.11.21
          make erc7730-cross-parity
      - name: ERC-7730 proxy-drift monitor (offline tests only)
        run: make test-erc7730-proxy-drift
      # A3.1 independent-source KAT leg (work-todo #7): the EXISTING Rust verifier
      # must accept FRESH output from the clean-room Python C10 signer
      # (contracts/verification/scripts/independent_c10_signer.py) — implementation
      # diversity for the differential oracle. python3 is present on ubuntu-latest.
      - name: independent C10 signer cross-verifier (Python signer -> Rust verify)
        run: cargo test --locked -p sphincs-c10 --test independent_signer_xcheck --release

  secure-tests:
    name: Secure-world unit tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # The secure crate host-builds with --no-default-features (the
      # semihosting backend is arch-gated to a host stub). This is the
      # `make test-unit` secure path; gates the usb_hw raw-MMIO fix.
      - name: cargo test (sphincs-tz-secure, host)
        run: |
          cargo test --locked -p sphincs-tz-secure \
            --no-default-features \
            --features mock-se,debug-log,ui-semihosting

  coverage:
    name: Line coverage (cargo llvm-cov — report-only baseline)
    runs-on: ubuntu-latest
    # TZP-7 (#478): no line-coverage measurement existed anywhere in CI. This
    # job is a BASELINE ONLY — it produces the report + lcov.info artifact but
    # enforces NO threshold; the ratcheting threshold is the issue's stated
    # follow-up. The sequential --no-report runs below mirror the EXACT test
    # invocations of the host-tests and secure-tests jobs (same crate sets,
    # same flags) so coverage measures precisely what CI already executes.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: cargo install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: cargo llvm-cov (host-test crate set, merged report)
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --locked --no-report --tests \
            -p pqsigner-proto -p pqsigner-tx-core -p pqsigner-aa \
            -p pqsigner-domain -p pqsigner-tx -p pqsigner-erc7730 \
            -p sphincs-c10 -p pqsigner-fi \
            -p sphincs-tz-bip39 -p fw-manifest -p sphincs-tz-shared \
            -p pqsigner-hal -p pqsigner-pq-seal -p masked-sha2 -p pqsigner-xtask \
            -p fwsign -p fwmeasure
          cargo llvm-cov --locked --no-report -p pqsigner-fsbl-tests \
            --lib \
            --test draft09_floor_stage_model \
            --test draft09_codec_candidates \
            --test draft09_resource_envelope \
            --test draft11_deletion_experiments \
            --test source_invariants
          cargo llvm-cov --locked --no-report -p sphincs-tz-secure \
            --no-default-features \
            --features mock-se,debug-log,ui-semihosting
          cargo llvm-cov --locked --no-report -p dbgen --tests
          cargo llvm-cov report --lcov --output-path lcov.info
      - name: Upload lcov.info
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lcov-coverage
          path: lcov.info
          retention-days: 14

  qemu-e2e:
    name: QEMU unified-sign E2E
    runs-on: ubuntu-latest
    # Generous bound for two release cross-builds + the ~40-scenario QEMU run
    # (normally ~5-10 min); a hang previously ran to the 6 h default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: thumbv8m.main-none-eabi
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install ARM linker and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-arm-none-eabi qemu-system-arm
      # Executes the complete secure+nonsecure image under mps2-an505 and
      # requires every unified-sign assertion, including ERC-7730 cases
      # 5p/5n, to reach the explicit ALL ASSERTIONS PASSED sentinel.
      - name: make e2e
        run: make e2e
      # TZP-12 (#483): publish the QEMU ELF pair + the interactive runner so
      # companion/third-party developers can exercise the wallet UX without a
      # firmware toolchain. The paths are exactly $(SECURE_ELF)/$(NONSECURE_ELF)
      # as built by the Makefile `e2e` target. if: always() keeps the ELFs for
      # debugging when the e2e assertions fail.
      - name: Upload QEMU ELF pair + wallet runner
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qemu-e2e-artifacts
          path: |
            target/secure/thumbv8m.main-none-eabi/release/sphincs-tz-secure
            target/nonsecure/thumbv8m.main-none-eabi/release/sphincs-tz-nonsecure
            tools/wallet_run.py
          retention-days: 14

  firmware-target-gates:
    name: Firmware-target gates (FSBL footprint + thumbv8m pair link)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: thumbv8m.main-none-eabi
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install ARM bare-metal toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-arm-none-eabi
      # F42: the 32 KiB legacy-region regression gate cross-compiles the real
      # FSBL to thumbv8m — it was green-when-run but enrolled in NO CI job
      # (host-tests deliberately excludes it: "belongs in a firmware-target
      # job"). F21: the test now fails CLOSED when arm-none-eabi-size is
      # absent in a CI context, so this step can never skip green again.
      - name: FSBL footprint (32 KiB legacy-region regression gate)
        run: cargo test --locked -p pqsigner-fsbl-tests --test footprint
      # F45: nothing else in CI ever links the secure+nonsecure pair with the
      # CMSE implib — veneer symbol drift (renamed/removed nsc_* export, or NS
      # referencing a veneer the secure cfg gates out) fails only at NS link
      # time. `make build-hw` builds the stm32u585 smoke image (non-shippable
      # by construction: mock-se/e2e-test are on the production denylist),
      # which emits --cmse-implib and links NS against the veneers object.
      - name: thumbv8m secure+nonsecure pair link (CMSE implib)
        run: make build-hw
      # TZP-11 (#482): secure-slot capacity gate — fwmeasure's strict
      # --require-secure-slot check enforces the 464 KiB A/B slot bound on the
      # linked image (was diagnostic-only, enrolled in no workflow; the FSBL
      # had its footprint gate above but the secure slot had none).
      # `make size-report` hard-errors at parse time unless
      # target/pqsigner-release/secure.elf exists (Makefile:2346), and
      # `build-hw` leaves its ELFs under target/{secure,nonsecure}/…, so the
      # pair is staged first. Verified locally on this tree: secure 355744 B of
      # 475136 B slot (74.9%), ns 16992 B static of 65536 B SRAM2.
      - name: Secure-slot capacity gate (make size-report)
        run: |
          mkdir -p target/pqsigner-release
          cp target/secure/thumbv8m.main-none-eabi/release/sphincs-tz-secure target/pqsigner-release/secure.elf
          cp target/nonsecure/thumbv8m.main-none-eabi/release/sphincs-tz-nonsecure target/pqsigner-release/nonsecure.elf
          make size-report

  miri:
    name: Miri (UB in host-reachable unsafe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # UB detection over the genuine host-reachable `unsafe`: the FI volatile
      # helpers (pqsigner-fi), the tx-core decoders, and the secure-world
      # NS-pointer deref + validation (the int->ptr boundary). Same crate set
      # as `make miri`. Light enough to run per-push (no checker download,
      # unlike Kani which is nightly-scheduled).
      - name: cargo miri test (FI / tx-core / NS-ptr)
        run: make miri

  slither:
    # HARD GATE at medium+ severity. This closes the repo's own oldest
    # self-identified pre-launch action: contracts/smart-wallet/AUDIT_STATIC_ANALYSIS.md
    # (2026-05-22) said "We do not currently gate CI on a clean slither run.
    # Pre-launch action: add slither + 4naly3er" and nothing landed for two
    # months. It also said to add it to contracts/smart-wallet/.github/workflows/
    # test.yml — a file GitHub never executes, so following the TODO literally
    # would have produced a check that silently never ran.
    #
    # Baseline before it was made blocking: 15 contracts / 102 detectors / 31
    # findings — ZERO high, three medium, rest informational+low. The three
    # mediums are triaged INDIVIDUALLY in contracts/smart-wallet/slither.db.json
    # (Slither's triage database keys on the finding, not the detector), with
    # the reasoning written out in AUDIT_STATIC_ANALYSIS.md. A new instance of
    # the same detector elsewhere still fails the build — verified by deleting a
    # triage entry and watching this go red.
    name: Slither (contracts static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: install foundry (slither drives `forge build` for this project)
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1
      - name: install slither (pinned)
        run: pip install "slither-analyzer==0.11.6"
      # SAME restore as the contracts job, deliberately duplicated rather than
      # simplified to `forge install`: lib/ is gitignored, the deps are
      # git-pinned by foundry.lock, and the set must be EXACT. A different lib
      # set changes the auto-generated remappings, which changes what solc
      # compiles — so an approximate restore would have slither analysing
      # something other than what ships.
      - name: Restore pinned Foundry libs (foundry.lock revs)
        working-directory: contracts/smart-wallet
        run: |
          set -euo pipefail
          declare -A URL=(
            [forge-std]=https://github.com/foundry-rs/forge-std
            [solady]=https://github.com/vectorized/solady
            [account-abstraction]=https://github.com/eth-infinitism/account-abstraction
            [openzeppelin-contracts]=https://github.com/openzeppelin/openzeppelin-contracts
            [p256-verifier]=https://github.com/daimo-eth/p256-verifier
            [safe-singleton-deployer-sol]=https://github.com/wilsoncusack/safe-singleton-deployer-sol
            [webauthn-sol]=https://github.com/base-org/webauthn-sol
          )
          mkdir -p lib
          for key in $(jq -r 'keys[]' foundry.lock); do
            name="${key#lib/}"
            url="${URL[$name]:-}"
            if [ -z "$url" ]; then
              echo "::error::foundry.lock dep '$name' has no URL mapping in ci.yml — add it"; exit 1
            fi
            rev=$(jq -r --arg k "$key" '.[$k].rev' foundry.lock)
            git clone -q "$url" "lib/$name"
            git -C "lib/$name" -c advice.detachedHead=false checkout -q "$rev"
            echo "  restored $name @ $rev"
          done
      - name: 'slither (config-driven: filter_paths, exclude_dependencies, fail_on=medium)'
        working-directory: contracts/smart-wallet
        run: slither .

  contracts:
    name: Contracts (forge test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1
      # lib/ is gitignored and the deps are git-pinned by foundry.lock (NOT
      # submodules), so restore each at its EXACT locked rev. The codehash
      # freeze tests are lib-exact: an extra/missing lib changes the
      # auto-generated remappings, which solc folds into the metadata hash
      # appended to the runtime bytecode → a different codehash.
      - name: Restore pinned Foundry libs (foundry.lock revs)
        working-directory: contracts/smart-wallet
        run: |
          set -euo pipefail
          declare -A URL=(
            [forge-std]=https://github.com/foundry-rs/forge-std
            [solady]=https://github.com/vectorized/solady
            [account-abstraction]=https://github.com/eth-infinitism/account-abstraction
            [openzeppelin-contracts]=https://github.com/openzeppelin/openzeppelin-contracts
            [p256-verifier]=https://github.com/daimo-eth/p256-verifier
            [safe-singleton-deployer-sol]=https://github.com/wilsoncusack/safe-singleton-deployer-sol
            [webauthn-sol]=https://github.com/base-org/webauthn-sol
          )
          mkdir -p lib
          for key in $(jq -r 'keys[]' foundry.lock); do
            name="${key#lib/}"
            url="${URL[$name]:-}"
            if [ -z "$url" ]; then
              echo "::error::foundry.lock dep '$name' has no URL mapping in ci.yml — add it"; exit 1
            fi
            rev=$(jq -r --arg k "$key" '.[$k].rev' foundry.lock)
            git clone -q "$url" "lib/$name"
            git -C "lib/$name" -c advice.detachedHead=false checkout -q "$rev"
            echo "  restored $name @ $rev"
          done
      - name: forge test (default profile)
        working-directory: contracts/smart-wallet
        run: forge test

  gate-enforcement:
    name: G1 — gate-enforcement lint (every soundness gate fires on its surface)
    runs-on: ubuntu-latest
    # Closes catalog class G1 (docs/verification/fv-adversarial-review-playbook.md
    # Part A2): a soundness gate that is green-when-run but never RUNS on the diff it
    # polices is false assurance. Fast (YAML + Makefile parse, no build) -> per-PR.
    # Meta: this lint must itself be CI-enforced, or it is its own G1.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: verify-gate-enforcement
        run: |
          python3 -m pip install --quiet pyyaml
          make verify-gate-enforcement
      # F11 (2026-07-16) — source-generated Kani harness census vs the committed
      # lock. Pure Python (no cargo kani), so it belongs here (fast per-PR) rather
      # than beside the slow nightly `make kani` / `verify-kani-mutation`.
      - name: verify-kani-census
        run: make verify-kani-census
