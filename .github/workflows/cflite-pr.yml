name: ClusterFuzzLite (PR)

# Time-boxed fuzzing of code changed in a PR (SOTA 2026-06 §6, Trezor-port).
# `code-change` mode fuzzes only what the diff touches, so it's fast enough
# for per-PR. A regression (new crash) fails the check + uploads a SARIF.
# The deeper continuous sweep is cflite-batch.yml (scheduled).

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/*.lean'

permissions:
  contents: read
  security-events: write

concurrency:
  group: cflite-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  PR:
    runs-on: ubuntu-latest
    # HARD GATE. The OSS-Fuzz Docker build (.clusterfuzzlite/build.sh, cargo-fuzz
    # from the excluded fuzz/ workspace inside base-builder-rust) was proven green
    # 2026-06-18 (cflite-batch run 27770338025, Build fuzzers = success), so a red
    # here is a real signal (build break or a new crash in changed code), not
    # config noise. Was briefly `continue-on-error` until that first green build.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: address
          # PRIVATE repo: authenticate ClusterFuzzLite's internal repo clone.
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: 'code-change'
          sanitizer: address
          output-sarif: true
