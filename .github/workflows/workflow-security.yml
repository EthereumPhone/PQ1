name: Workflow security (zizmor + actionlint + gitleaks)

# The CI estate audits itself.
#
# WHY (external security research 2026-07-31, P0): this repo's workflows hold
# `ANTHROPIC_API_KEY` and drive release artefacts, and until now the ONLY thing
# guarding them was SHA-pinning discipline plus reviewer attention. Nothing
# verified that the discipline held, and nothing looked for the workflow-level
# flaw classes (template injection, `pull_request_target` misuse, over-broad
# `GITHUB_TOKEN`, credential persistence) that carried the 2025 tj-actions and
# 2026 Shai-Hulud compromises. This job is that verifier.
#
# BASELINE, established locally before this file was committed (2026-07-31):
#   * zizmor 1.28.0 over `.github/workflows/**`  -> 0 findings, after the same
#     commit added `persist-credentials: false` to all 24 `actions/checkout`
#     steps (24 x medium `artipacked`: the checkout token was being left in
#     `.git/config` for every subsequent step in the job to reuse).
#   * actionlint 1.7.7 over `.github/workflows/**` -> 0 findings, modulo one
#     ignored rule; see the `-ignore` flag below. NOTE: actionlint shells out to
#     `shellcheck` when it is on PATH, and GitHub's runner image HAS it. The
#     first baseline was taken on a box without it and therefore MISSED four
#     real findings (SC2015 in lean-extracted.yml, SC2046 x2 + SC2155 in
#     nightly.yml), which promptly turned this gate red on its first CI run.
#     They are fixed in the same commit that adds this note. If you re-baseline,
#     install shellcheck first or you will repeat the mistake.
#   * gitleaks 8.24.0 over the FULL history (4754 commits, 535 MB) with
#     `.gitleaks.toml` -> 0 findings. 4372 raw hits triaged, all false
#     positives, all allowlisted by family in that file.
# Because all three baselines are clean, all three are HARD gates from the
# start. There is no "warn for now" grace period to forget to remove.
#
# `contracts/smart-wallet/.github/workflows/**` is audited REPORT-ONLY. That
# subtree is inert — GitHub only executes workflows under the repository-root
# `.github/workflows/` — but it is not clean (9 x high `unpinned-uses`), and
# it is a fork-inherited template that a future contributor could copy from.
# Auditing it visibly is the point; failing on it would gate this repo on
# files that never run.

on:
  push:
    branches: [master]
    paths: &wfsec_paths
      # `.github/**`, not just `workflows/**`: the invisible-unicode gate
      # registered in scripts/gate_enforcement.json declares it polices the
      # whole `.github` tree (issue templates and any future agent config are
      # just as executable-by-a-reader as a workflow), and
      # scripts/check_gate_enforcement.py FAILS the build if a gate's trigger
      # does not cover the surface it claims — the F1 class: a gate that is
      # green-when-run but never runs on the diff it polices.
      - '.github/**'
      - '.gitleaks.toml'
      - 'scripts/check_invisible_unicode.py'
      - 'scripts/gate_enforcement.json'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '.claude/**'
      - '.cursorrules'
      - 'contracts/smart-wallet/.github/workflows/**'
  pull_request:
    paths: *wfsec_paths
  schedule:
    # Weekly full-history secret sweep. The per-push job only sees the current
    # tree; a secret committed and reverted is only ever caught by the history
    # scan, so it needs its own cadence.
    - cron: '0 5 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: workflow-security-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned by version AND verified by the sha256 published in the upstream
  # release's own checksums file. Both were checked by hand on 2026-07-31
  # against `actionlint_1.7.7_checksums.txt` / `gitleaks_8.24.0_checksums.txt`.
  # This is deliberately NOT `curl | sh`: see the elan-installer issue.
  ACTIONLINT_VERSION: '1.7.7'
  ACTIONLINT_SHA256: '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757'
  GITLEAKS_VERSION: '8.24.0'
  GITLEAKS_SHA256: 'cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4'
  ZIZMOR_VERSION: '1.28.0'

jobs:
  workflow-lint:
    name: zizmor + actionlint (HARD — repo-root workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: install actionlint (pinned + sha256-verified)
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o actionlint.tgz "$url"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - name: install zizmor (pinned)
        run: pipx install "zizmor==${ZIZMOR_VERSION}"

      # `-ignore` carries one exemption, and it is an actionlint limitation,
      # not a repo defect: lean-extracted.yml deliberately shares ONE `paths:`
      # list between `push` and `pull_request` via a YAML anchor/alias
      # (`&extracted_paths` / `*extracted_paths`) so the two filters can never
      # drift apart — drift there silently un-gates the extracted-proof job.
      # GitHub's YAML parser resolves the alias (the workflow parses and runs);
      # actionlint's schema check does not model alias nodes under `paths`.
      # If that exemption ever needs to cover a second file, do not widen the
      # regex — ask why.
      - name: actionlint (repo-root workflows)
        run: |
          actionlint -no-color -oneline \
            -ignore '"paths" section must be sequence node but got alias node' \
            .github/workflows/*.yml

      # `--offline` keeps this job off the network: the online audits resolve
      # action refs against the GitHub API, which would make a security gate
      # depend on an external service being up. Everything that matters here
      # (unpinned-uses, artipacked, excessive-permissions, template-injection,
      # dangerous-triggers) is a static audit.
      - name: zizmor (repo-root workflows — hard gate at medium+)
        run: zizmor --offline --min-severity medium --format plain .github/workflows/

      # Invisible-Unicode gate. Sits in THIS workflow rather than its own
      # because it polices the same class of thing: content that a reviewer
      # cannot see. Zero-width runs are how the 2026 TrapDoor campaign hid
      # payloads inside the `CLAUDE.md`/`.cursorrules` files coding agents
      # execute; bidi overrides are Trojan Source (CVE-2021-42574). Neither
      # shows up in `git diff`.
      #
      # The self-test runs FIRST and is not decoration: it plants five payload
      # classes and asserts each fires, plus three benign inputs that must stay
      # silent. If the scanner is ever broken into always-returning-clean, this
      # step goes red instead of quietly certifying nothing.
      #
      # Invoked through `make` rather than calling the script directly, for two
      # reasons: local and CI then run byte-identical commands, and
      # scripts/check_gate_enforcement.py can only verify a gate is actually
      # wired if the workflow invokes its declared `make` target. A gate that is
      # green-when-run but never runs is the exact failure that check exists for.
      - name: invisible-unicode (zero-width + Trojan Source)
        run: make invisible-unicode

  workflow-lint-contracts:
    name: zizmor (report-only — inert contracts subtree)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: install zizmor (pinned)
        run: pipx install "zizmor==${ZIZMOR_VERSION}"
      - name: zizmor (advisory)
        continue-on-error: true
        run: |
          zizmor --offline --format plain contracts/smart-wallet/.github/workflows/ || true
          echo
          echo "NOTE: this subtree is NOT executed by GitHub Actions (only the"
          echo "repository-root .github/workflows/ is). Findings here are"
          echo "hygiene + fork-template debt, tracked as their own issue."

  secrets:
    name: gitleaks (HARD — tree per push, full history weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          # The weekly sweep needs the whole history; per-push runs do not.
          fetch-depth: ${{ github.event_name == 'schedule' && 0 || 1 }}

      - name: install gitleaks (pinned + sha256-verified)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o gitleaks.tgz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: gitleaks (working tree)
        if: github.event_name != 'schedule'
        run: gitleaks dir . --no-banner --redact -c .gitleaks.toml

      - name: gitleaks (full history)
        if: github.event_name == 'schedule'
        run: gitleaks git . --no-banner --redact -c .gitleaks.toml --log-opts=--all

  dependency-review:
    # ADVISORY, and not by preference. The action requires the repository's
    # Dependency graph to be enabled (Settings > Code security), which needs
    # repo-admin — the maintainer landing this has push+triage only. Without it
    # the action fails with "Dependency review is not supported on this
    # repository", which is an availability failure, not a policy violation, and
    # must not gate merges. Flip it to a hard gate the day the graph is on;
    # `cargo-deny`/`cargo-vet` remain the authoritative deciders either way.
    continue-on-error: true
    name: dependency-review (PR only — advisory until Dependency graph is on)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      # The PR-time complement to .github/dependabot.yml: dependabot proposes
      # updates, this refuses a PR that ADDS a vulnerable or policy-violating
      # dependency. `cargo-deny`/`cargo-vet` remain the authoritative gates —
      # this one reads the GitHub advisory graph, which is a different corpus.
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
