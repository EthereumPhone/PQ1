name: Lean FV (extracted §33 Aeneas)

# CI gate for the §33 Aeneas-extracted-code project
# (contracts/verification/extracted/). The mathlib-free `SphincsCVerify` suite
# is gated by lean-fv.yml; this is its heavier sibling — `extracted/` pins a
# DIFFERENT toolchain (v4.30.0-rc2) and IMPORTS mathlib (via the `aeneas` Lean
# backend dep), so it needs the prebuilt-mathlib cache and was intentionally
# split out. It enforces the §33 axiom-discipline that `make verify-extracted`
# checks: every Aeneas-extracted rank (the C10/UserOp/RLP/Decode/PinState/…
# equivalence + spec theorems) builds with NO `sorry`, and `AxiomCheck.lean`'s
# `#print axioms` dump contains NO `sorryAx` in any §33 theorem closure.
#
# Until 2026-06-26 this project had zero CI coverage — a `sorry`/axiom
# regression in an extracted rank (e.g. the new PinState rejection rank) was
# review-time only. Positive `paths:` filter so it runs exactly when the
# extracted sources / the Makefile change; `lake exe cache get` pulls the
# prebuilt mathlib oleans from the Lean reservoir (the pinned revision has a
# published cache), so the job builds only the aeneas backend lib + the
# Extracted ranks, not mathlib from source.

# The `paths:` MUST include the Rust SOURCE crates the extraction MIRRORS — not just
# extracted/** — else a change to (e.g.) domain/src/lib.rs that the extracted Lean
# proves-about merges without ever re-triggering this gate, and the theorems keep
# proving the OLD function (extracted-F1, 2026-07-02). The extract-* regen-diff sweep
# (make extract-*) + the executed differential catch the resulting drift.
# extraction_registry.json (the verify-extraction-freshness pin registry) MUST also be
# here: a registry-ONLY edit (re-pin, deletion, waiver change) must re-trigger its own
# gate — F3d (2026-07-19), the deletion-tolerance/self-reference finding.
on:
  push:
    branches: [master]
    paths: &extracted_paths
      - 'contracts/verification/extracted/**'
      - 'contracts/verification/extraction_registry.json'
      - 'contracts/verification/Makefile'
      - 'contracts/verification/scripts/check_extraction_freshness.py'
      - 'contracts/verification/scripts/check_extraction_regen_output.py'
      - '.github/workflows/lean-extracted.yml'
      - 'sphincs-c10/src/**'
      - 'aa/src/**'
      - 'tx-core/src/**'
      - 'tx/src/**'
      - 'proto/src/**'
      - 'domain/src/**'
      - 'fw-manifest/src/**'
      - 'bip39/src/**'
  pull_request:
    paths: *extracted_paths
  schedule:
    # nightly — runs the executed differential + vendored-fidelity legs even when no
    # path changed, so a drift that slipped a path filter is still caught within 24h.
    - cron: '30 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lean-extracted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean-extracted:
    name: lake build Extracted + no-sorryAx axiom gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: install elan (toolchain pinned by extracted/lean-toolchain = v4.30.0-rc2)
        run: |
          # Pinned + verified, not `curl | sh` from a moving branch. `master`
          # is mutable: whoever controls that ref controls the toolchain
          # installer on every FV runner, which is the trust root the
          # verification Makefile builds on. Pin the commit, check the bytes,
          # and only then execute. (#562)
          set -euo pipefail
          ELAN_REF=464c9d28395000a2a0128e07081e4956d50eced2
          ELAN_SHA256=a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://raw.githubusercontent.com/leanprover/elan/${ELAN_REF}/elan-init.sh" \
            -o elan-init.sh
          echo "${ELAN_SHA256}  elan-init.sh" | sha256sum -c -
          sh elan-init.sh -y --default-toolchain none
          rm -f elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # Cache the whole `.lake` (the aeneas backend-lib oleans + the prebuilt
      # mathlib oleans + the Extracted ranks). On a sources-unchanged hit this
      # is a full restore; on a miss the restore-keys recover the heavy
      # mathlib/aeneas oleans and only the changed Extracted modules rebuild.
      - name: cache extracted/.lake
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: contracts/verification/extracted/.lake
          key: lean-extracted-lake-${{ hashFiles('contracts/verification/extracted/lake-manifest.json', 'contracts/verification/extracted/lean-toolchain') }}-${{ hashFiles('contracts/verification/extracted/Extracted/**/*.lean', 'contracts/verification/extracted/Extracted.lean') }}
          restore-keys: |
            lean-extracted-lake-${{ hashFiles('contracts/verification/extracted/lake-manifest.json', 'contracts/verification/extracted/lean-toolchain') }}-
            lean-extracted-lake-
      # Pull prebuilt mathlib oleans (fast Azure download) so mathlib is never
      # built from source. Best-effort: a cache miss falls through to a source
      # build rather than failing the job.
      - name: fetch prebuilt mathlib cache
        # Best-effort: a cache miss must fall through to a source build, not
        # fail the job. Written as an explicit `if` because `A && B || C` is
        # not if-then-else — `C` also runs when `A` succeeds and `B` fails,
        # which is the SC2015 footgun.
        run: |
          if cd contracts/verification/extracted; then
            lake exe cache get || true
          fi
      # Build the Extracted ranks + run the no-sorry / no-sorryAx axiom gate.
      # GUARANTEED <16 GB: FormatDecimalSpec is carved out of the default target
      # (verified locally 2026-07-07 — this step peaks ~2.3 GB).
      #
      # ⚠ MEMORY (diagnosed 2026-07-07, tracked in docs/archive/work-todo-retired-2026-07-19.md). The single
      # declaration `FormatDecimalSpec.format_decimal_spec` (the end-to-end WYSIWYS
      # `U256::format_decimal` WP-monad composition) KERNEL-TYPECHECKS at ~42 GB
      # RSS / ~1470 s — over this 16 GB runner. ROOT CAUSE is the kernel typecheck
      # of the proof TERM (the accumulating `Eq.mpr` motives across the `let*`
      # binds), NOT elaboration (with `debug.skipKernelTC` the whole file
      # elaborates in ~4.5 s / 2.5 GB). Profiler (`-Dtrace.profiler`) confirms it is
      # a genuine SINGLE-declaration cost — the ONLY `[Kernel]` decl over threshold.
      # Fix attempts EXHAUSTED: lemma-lifting (`round_post_facts` lifted; a
      # `trim_true_facts` lift RAISED the peak, reverted); and a per-bind PEEL that
      # split the `let*` seams into separate stage lemmas (2026-07-07) — MEASURED to
      # leave `format_decimal_spec`'s own kernel-TC UNCHANGED at ~42 GB (the peeled
      # stages typecheck in <500 ms, but the `unfold`-and-reduce-the-WP-chain cost
      # stays in the outer decl; the extract→round chain alone is ≥23 GB > 16 GB,
      # independent of the tail), so it was reverted.
      #
      # RESOLUTION (landed 2026-07-07): FormatDecimalSpec is CARVED OUT of the
      # default `Extracted` lib + `AxiomCheck.lean`, so this `verify-extracted` step
      # never builds it (stays ~2.3 GB, always green on 16 GB). It stays a REAL `qed`
      # (closure [propext, Classical.choice, Quot.sound]) — built + axiom-gated by
      # the non-default `ExtractedFormatDecimalHeavy` lib via
      # `make verify-extracted-heavy` locally / on a ≥48 GB runner. It is not
      # invoked by this 16 GB job. This does NOT weaken the §33 axiom gate on any
      # other rank.
      - name: verify-extracted (lake build + axiom-discipline gate, <16 GB)
        run: make -C contracts/verification verify-extracted LAKEFLAGS=-j1
      # Vendored-spec fidelity: the extracted ADRS spec must match the SphincsCVerify
      # v4.22 source it vendors (python diff — lightweight, no toolchain).
      - name: verify-spec-vendored-fidelity
        run: make -C contracts/verification verify-spec-vendored-fidelity
      # The ONLY layer that catches a consistently-wrong Charon/Aeneas translation:
      # execute the extracted Lean vs the executed-Rust oracle (signed_preimage + vectors).
      - name: verify-extract-differential
        run: make -C contracts/verification verify-extract-differential

      # F1 (2026-07-16) — TOOLCHAIN-FREE freshness tripwire. The extract-* regen
      # targets need the charon/aeneas toolchain (absent on this runner), so this
      # pins sha256(committed Lean)+sha256(mirrored Rust) and FAILS if Rust drifted
      # without a re-extraction. Pure Python, no toolchain. The heavy toolchain
      # regen (`make verify-extraction-regen`) stays LOCAL (see gate_enforcement.json).
      - name: verify-extraction-freshness (F1 sha256 tripwire)
        run: make -C contracts/verification verify-extraction-freshness
