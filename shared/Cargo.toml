[package]
name = "sphincs-tz-shared"
version = "0.1.0"
edition.workspace = true

# After Phase 3 of the modularity refactor, this crate is a thin
# re-export shim plus the two implementation modules (`apdu_framing`,
# `db_format`) that did not fit `pqsigner-proto`'s "constants only"
# policy. Existing call sites that `use sphincs_tz_shared::CMD_FOO`
# keep working unchanged via `pub use pqsigner_proto::*;`. New code
# should import from `pqsigner-proto` directly.
#
# Reference: /home/markus/.claude/plans/ok-make-a-plan-logical-lobster.md
# Phase 3.

[features]
default = []
# Forwarded to pqsigner-proto so the secure/nonsecure crates can enable
# `sphincs-tz-shared/stm32u585` (existing call site) and have it
# propagate to the regions / NS_SRAM constants in pqsigner-proto.
stm32u585 = ["pqsigner-proto/stm32u585"]

[dependencies]
pqsigner-proto = { workspace = true }

[dev-dependencies]
# Property-based fuzzing for the parsers in `apdu_framing.rs`. These are
# the first thing every USB byte sees on its way into the firmware, so a
# panic on hostile input is a direct path from "anyone with a USB cable"
# to a secure-world DoS. Runs on host only via
# `cargo test -p sphincs-tz-shared --tests`; no_std builds for ARM never
# compile this dependency. See also `secure/src/fuzz_props.rs` for the
# matching harness over the secure-side parsers.
proptest = "1"
