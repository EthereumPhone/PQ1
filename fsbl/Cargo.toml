[package]
name = "pqsigner-fsbl"
version = "0.1.0"
edition.workspace = true
description = "PQSigner legacy bench first-stage bootloader — production-fenced vendor-C10 A/B slot selector."

[[bin]]
name = "pqsigner-fsbl"
path = "src/main.rs"

[features]
# Release-only hardening profile. Requires an absolute vendor-key snapshot
# whose fingerprint exactly matches the reviewed workspace release policy.
# `make fsbl-release` is the supported entry point.
mode-production = []
# Bench-only acknowledgement that this FSBL still reads the rejected unary
# OTP rollback encoding.  It changes no runtime behaviour.  All production
# builds reject the legacy backend; `make fsbl` and the isolated footprint
# test opt in explicitly until an approved replacement backend is implemented.
legacy-fw-rollback-unsafe = []
# Bench-only: short-circuit FSBL boot into the NV3007 LCD self-test
# (`nv3007::lcd_test_loop`) so the display port can be validated on real
# silicon WITHOUT a signed slot. Never ships. Build/run via
# `make fsbl-lcd-test-hw`.
lcd-test = []

[dependencies]
# Signature verification — same crate the main firmware uses, so the
# Rust and Solidity verifiers remain byte-compatible. Verify-only (no
# keygen, no sign).
#
# NOTE: we use the SOFTWARE SHA-256 path in FSBL, not `hw-sha256`.
# Wiring up the HASH peripheral here would require porting RCC init,
# the HASH driver, and the `pqsigner_sha256_*` extern fns from the
# secure crate. Software SHA-256 at 16 MHz takes about 1 s for a full
# FSBL boot (verify + image-hash both manifests + both slots). That's
# acceptable as a boot budget; the HW-SHA acceleration is a tracked
# follow-up optimization.
sphincs-c10 = { workspace = true }

# Manifest / boot-state layout. no_std, no alloc.
fw-manifest = { workspace = true }

# F-7 defense-in-depth: shared FI hardening primitives (sentinels,
# check_true_into_sentinel, wait_random_loop). FSBL closes the
# `verify_signature` call site the same way `secure::verify_manifest`
# already does, so a single-fault bypass on either gate is impossible.
pqsigner-fi = { workspace = true }

# tz-1 option-byte tripwire (#366): the ship/locked option-byte PROFILE and its
# pure compare functions live in `shared::lockdown`, host-tested there, so this
# stage and the secure world's first-boot Phase A check ONE definition instead
# of two drifting copies. no_std; its only deps are pqsigner-proto and
# pqsigner-fi (already above), and `lockdown` is consts + const fns, so the
# image cost is the call sites.
sphincs-tz-shared = { workspace = true }

# SHA-256 for the verify_digest path and the slot-image re-hash.
# sha2 is gated behind fw-manifest's default-off std feature, but the
# direct dep here ensures we can call it from verify.rs too.
sha2        = { version = "0.10", default-features = false }

# BIP-39 prefix-5 wordlist for the on-OLED firmware fingerprint render.
# Workspace declares this dep with `default-features = false`, which is
# exactly what FSBL wants — only the prefix-5 layer is pulled in,
# stripping the ~18 KB flat wordlist + Mnemonic + PBKDF2 + CT exact
# lookups out of FSBL's binary.
sphincs-tz-bip39 = { workspace = true }

# Cortex-M runtime.
cortex-m     = { workspace = true, features = ["critical-section-single-core"] }
cortex-m-rt  = { workspace = true }

# Panic handler (halts). Never unwinds — we can't recover into a
# "please reboot" UI since the OLED isn't reliable at FSBL time.
panic-halt   = "1"

[build-dependencies]
# build.rs pre-computes the vendor-pubkey fingerprint (so the runtime
# check can publish it in build diagnostics). Host-only; not in the final
# binary. The public development pubkey is centralized as reviewed hex under
# `config/`, so build.rs does not carry a second copy of its signing seed.
sha2        = "0.10"
