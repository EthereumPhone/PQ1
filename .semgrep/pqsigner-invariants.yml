# PQSigner non-negotiable invariants — machine-enforced (Semgrep).
#
# These rules turn the prose invariants in CLAUDE.md ("Non-Negotiable
# Invariants" / "What NOT to do") into a CI gate. Run via `make invariant-gates`
# (which also runs cargo-deny and the scoped host-verifier dependency gate for
# dependency-level invariant #5).
#
# Calibration: rules with ZERO findings on the current tree are ERROR (hard
# gate); rules with pre-existing legitimate-but-discouraged sites are WARNING
# (surface for review, don't break the build). Verified against the tree
# 2026-06-16: the three ERROR rules are clean (0 findings).
#
# Run standalone:  semgrep --config .semgrep/pqsigner-invariants.yml --error
# (`--error` makes a WARNING-only run still exit 0; ERROR findings exit non-zero.)

rules:
  # ── Invariant #5: SPHINCS+C10 is the ONLY signature primitive ──────────────
  - id: no-classical-signer-import
    languages: [generic]
    severity: ERROR
    message: >
      Invariant #5 (non-negotiable): SPHINCS+C10 is the wallet's ONLY signature
      primitive — no classical signer (secp256k1/k256/p256/ecdsa/ed25519/
      schnorrkel) in firmware, FW-update, or the on-chain verifier. Belt-and-
      braces with deny.toml's [bans]. If you truly need this crate, you are
      breaking invariant #5 — stop.
    paths:
      include: ['*.rs']
      exclude: ['dbgen/src/erc8176.rs']
    patterns:
      - pattern-regex: '(?m)^\s*(use|extern\s+crate)\s+(secp256k1|libsecp256k1|k256|p256|ecdsa|ed25519|ed25519_dalek|ed25519_compact|schnorrkel)\b'

  - id: no-ecrecover-in-wallet-contracts
    languages: [generic]
    severity: ERROR
    message: >
      Invariant #5: the PQ smart wallet has a single c10Verifier and NO classical
      signer. `ecrecover` must not appear in the wallet / factory / verifier
      contracts (a hybrid ECDSA path would re-introduce a classical signer).
    paths:
      include: ['contracts/smart-wallet/src/']
    patterns:
      - pattern-regex: '\becrecover\s*\('

  # ── Invariants #6 / #7: immutable bootstrap keys; monotonic unresettable caps ─
  - id: no-key-rotation-or-cap-reset-in-contracts
    languages: [generic]
    severity: ERROR
    message: >
      Invariants #6/#7 (non-negotiable): bootstrap C10 keys are immutable per
      wallet (CREATE2 salt depends only on them) and per-chain caps are monotonic
      & unresettable. No `rotateMasterKeys`, `reset*`, or `increaseMax*` function
      may exist in the wallet/factory/multiownable contracts.
    paths:
      include: ['contracts/smart-wallet/src/']
    patterns:
      - pattern-regex: '\bfunction\s+(rotateMasterKeys|reset[A-Za-z0-9_]*|increaseMax[A-Za-z0-9_]*)\b'

  # ── Unsafe taxonomy: pure-logic crates are 100% safe Rust ──────────────────
  # Operationalises CLAUDE.md's unsafe taxonomy boundary. The five structurally
  # required `unsafe` categories (CMSE veneers, NS-ptr deref, SHA-256 hooks, FI
  # volatile helpers, static-mut driver state) live in secure/ — with THREE
  # deliberately host-placed exceptions that are `exclude:`d below. These are NOT
  # a regression: they are the SAME structurally-required categories, relocated
  # into a host-runnable crate PRECISELY so they can be formally verified there,
  # and each carries a `// SAFETY:` block (2026-07-14 reconciliation — F13 of the
  # full-project sweep):
  #   * shared/src/ns_ptr_validate.rs — category (2) NS-pointer deref, extracted
  #     verbatim from secure/src/nsc (commit c2cc92c8) so the window check is
  #     Kani-proven (`cargo kani -p sphincs-tz-shared`, the `#[cfg(kani)] mod
  #     verification` block) and the raw `read_volatile`/`write_volatile`/
  #     `from_raw_parts` copy primitives are Miri-tree-borrows-checked
  #     (`cargo +nightly miri test -p sphincs-tz-shared`). Re-exported by
  #     secure/src/nsc/{ns_ptr,ptr_validate}.rs — genuinely shared, not stray.
  #   * pqsigner-erc7730/src/display/render/mod.rs — category (4) FI stack-canary
  #     volatiles (`write_volatile`/`read_volatile` on STACK_CANARY), which rode
  #     into the host crate with the render dispatch (commit 695c1e8b, 2026-07-04)
  #     so it is host-fuzzable / Kani-linkable. They MUST stay volatile — a
  #     `core::hint::black_box` swap gives no stack-materialisation/reload
  #     guarantee, so the overrun check could compile to a no-op (silent FI
  #     weakening), and it contradicts taxonomy category (4) ("must be
  #     read_volatile/write_volatile to defeat compiler folding").
  #   * pqsigner-erc7730/src/display/mod.rs — category (4) FI transcript-buffer
  #     poison/reset volatiles. The double-render dispatcher checks this poison
  #     between independent renders; ordinary stores could be removed before
  #     the second render. Each pointer comes from a unique live mutable borrow.
  # The `exclude:` list must stay EXACTLY these three files; `make invariant-gates`
  # asserts that so a future over-broad exclude cannot silently silence a real
  # unsafe. (We deliberately do NOT add a raw-MMIO `*_volatile` rule here: ~50
  # legit sites in secure/ — the documented hw::mmio migration queue + the
  # irreducible fi/nsc/hash categories — would make it pure noise. SAFETY-comment
  # coverage is better enforced by clippy::undocumented_unsafe_blocks than by a
  # generic-mode regex, and "no new flash state" is not expressible soundly.)
  - id: no-unsafe-in-pure-logic-crates
    languages: [generic]
    severity: ERROR
    message: >
      Unsafe taxonomy (CLAUDE.md): the pure-logic workspace crates (proto, bip39,
      tx-core, aa, domain, tx, pqsigner-erc7730, hal, shared) are host-runnable,
      no_std, stack-only, and MUST stay 100% safe Rust — every structurally
      required `unsafe` lives in the secure HAL / NSC veneers / FI helpers, or in
      the three documented host-verified exceptions excluded by this rule
      (shared/src/ns_ptr_validate.rs, pqsigner-erc7730/src/display/render/mod.rs,
      pqsigner-erc7730/src/display/mod.rs).
      If a parser/derivation seems to need NEW `unsafe`, that is a design smell —
      find the safe formulation.
    paths:
      include:
        - 'proto/src/'
        - 'bip39/src/'
        - 'tx-core/src/'
        - 'aa/src/'
        - 'domain/src/'
        - 'tx/src/'
        - 'pqsigner-erc7730/src/'
        - 'hal/src/'
        - 'shared/src/'
      # Host-relocated structurally-required unsafe — see the header comment
      # above for the Kani/Miri/test proof pointers. KEEP EXACTLY THESE THREE ENTRIES
      # (asserted by `make invariant-gates`).
      exclude:
        - 'shared/src/ns_ptr_validate.rs'
        - 'pqsigner-erc7730/src/display/render/mod.rs'
        - 'pqsigner-erc7730/src/display/mod.rs'
    patterns:
      - pattern-regex: '\bunsafe\s*(\{|fn\b|impl\b|trait\b|extern\b)'

  # ── Invariants #1 / #2: no secure element is shown a PIN (#855) ─────────────
  # Ledger Donjon reported that each secure element held the PIN in a form
  # that needed nothing from the microcontroller: the SE050 user UserID was
  # the raw digits and OPTIGA F1D0 an unkeyed SHA-256 of them. Since #855 a
  # chip is shown only `PRF(device_key, label || salt || PIN)`, produced by
  # `secure/src/pin_credential.rs` and reachable only through `pin_gate`.
  #
  # These four rules are tripwires for the honest mistake. They match names
  # and call shapes, so they do not prove the property. What makes the
  # mistake a compile error is the types: the SE050 builders take
  # `apdu::UserIdValue`, which cannot be built from a PIN typed in at run
  # time, and the drivers take `pin_credential` images. What tests it is
  # `pin_credential` / `pin_salt` on the host. These rules catch what is
  # left: a new sink, a new unkeyed hash, credential bytes read somewhere
  # new. `.semgrep/check_pin_credential_rules.py` (run by `make
  # invariant-gates` and CI) feeds each rule the pre-#855 shapes and fails
  # unless every one of them fires; on the unmodified pre-#855 tree the
  # first two fire on the original vulnerable lines.
  - id: no-pin-named-value-to-secure-element-sink
    languages: [generic]
    severity: ERROR
    message: >
      Invariants #1/#2 (#855): a PIN must never be presented to, or written
      into, a secure element. This call hands a `*pin` value to an SE050
      UserID sink. Derive through `crate::pin_gate` and pass
      `UserIdValue::Credential`. (`admin_pin` / `tr_pin` / `final_pin` are
      device secrets from `hw::secret_keys`, not PINs, and are exempt.)
    paths:
      include: ['secure/src/']
      exclude:
        - 'secure/src/se050_stress/'
        - '*_under_test/*'
        - '*pure_tests*.rs'
    patterns:
      - pattern-regex: '\b(verify_session|write_userid|write_userid_unlimited|iterative_delete_all|user_factory_reset|iterative_wipe)\s*\([^;{}]{0,400}?(?<![A-Za-z0-9_])(?!admin_pin\b|tr_pin\b|final_pin\b)[A-Za-z0-9_]*pin\b'

  - id: no-unkeyed-pin-derivation-in-se-path
    languages: [generic]
    severity: ERROR
    message: >
      Invariants #1/#2 (#855): what a secure element is shown must be keyed by
      the device hardware key. The pre-#855 OPTIGA secret was
      `kdf(PIN_AUTH_DOMAIN, pin, 0)`, an unkeyed SHA-256 anyone holding the
      chip could search offline. Do not derive from a PIN anywhere on the
      secure-element path; `pin_credential::derive_set` is the only
      derivation.
    paths:
      include:
        - 'secure/src/se050/'
        - 'secure/src/optiga/'
        - 'secure/src/dual_se.rs'
        - 'secure/src/pin_gate.rs'
        - 'secure/src/hw/secret_keys.rs'
    patterns:
      - pattern-regex: '(\bPIN_AUTH_DOMAIN\b|\bderive_pin_secret\b|optiga-pin-auth-v1|\bkdf(_sha256)?\s*\([^;{}]{0,200}?(?<![A-Za-z0-9_])[A-Za-z0-9_]*pin\b)'

  - id: pin-credential-bytes-confined
    languages: [generic]
    severity: ERROR
    message: >
      #855: the bytes of a PIN credential may be read only where they go on
      the wire: in the OPTIGA driver, and in `UserIdValue::bytes` in the
      SE050 APDU layer. Reading them anywhere else (`expose_for_optiga` /
      `expose_for_se050`) lets the value one chip holds travel to places
      nothing reviews. The one bench use carries an explicit `nosemgrep`
      waiver; do not add another without one.
    paths:
      include: ['secure/src/']
      exclude:
        - 'secure/src/optiga/mod.rs'
        - 'secure/src/se050/apdu.rs'
        - 'secure/src/pin_credential.rs'
        - '*_under_test/*'
        - '*pure_tests*.rs'
    patterns:
      - pattern-regex: '\.expose_for_(optiga|se050)\s*\('

  - id: post-wipe-counter-reset-is-gated
    languages: [generic]
    severity: ERROR
    message: >
      #855: after a wipe the page-124 attempt counter may be reset only once
      the PIN-credential salt is verified gone, or an attacker emulating an
      extracted chip gets ten more guesses per wipe. On a wipe path use
      `hw::flash::pin_attempts_reset_after_wipe()`. A bare reset, the bench
      reset, or the correct-PIN reset has no business in these files.

      Scope: every file under secure/src except the five that legitimately
      name another reset. Those five are covered by the source pin
      `negative_post_wipe_counter_reset_is_gated_on_the_salt` instead
      (main.rs and dual_se.rs: bench flows call the bench reset, call sites
      counted; nsc/mod.rs: the correct-PIN reset in gated_unlock, exactly
      once; nsc/cmd_test_pin_lockout.rs: the e2e-only lockout command;
      hw/flash.rs: the definitions).
    paths:
      include:
        - 'secure/src/'
      exclude:
        - 'secure/src/main.rs'
        - 'secure/src/dual_se.rs'
        - 'secure/src/nsc/mod.rs'
        - 'secure/src/nsc/cmd_test_pin_lockout.rs'
        - 'secure/src/hw/flash.rs'
        - '*_under_test/*'
        - '*pure_tests*.rs'
    patterns:
      - pattern-regex: '\bpin_attempts_reset(_bench|_after_correct_pin)?\s*\(\s*\)'

  # ── Convention (WARNING): ASCII materialisation via ui::ascii_str ──────────
  - id: from-utf8-unchecked-prefer-ascii-str
    languages: [generic]
    severity: WARNING
    message: >
      Convention (CLAUDE.md unsafe taxonomy): materialise ASCII-by-construction
      buffers via `crate::ui::ascii_str`, not `core::str::from_utf8_unchecked`.
      Review/migrate these call sites. (Known pre-existing: secure/src/main.rs
      boot-fingerprint hex, secure/src/se050_stress.)
    paths:
      include: ['*.rs']
      exclude:
        - '*ascii*.rs'
        - '*/tests/*'
        - '*_under_test/*'
        - '*pure_tests*.rs'
    patterns:
      - pattern-regex: '\bfrom_utf8_unchecked\s*\('
