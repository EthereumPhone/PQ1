[package]
name = "pqsigner-fsbl-tests"
version = "0.1.0"
edition.workspace = true
publish = false

# Host-only test crate for the `pqsigner-fsbl` bootloader.
#
# Cannot live inside `fsbl/tests/` because `pqsigner-fsbl` is a `[[bin]]`
# crate with `#![no_std]` / `#![no_main]` / `panic-halt` — `cargo test`
# tries to build the bin in `cfg(test)` (std) mode and trips on
# duplicate `panic_impl` lang items.
#
# Tests here shell out to `cargo build -p pqsigner-fsbl` as a subprocess,
# parse `arm-none-eabi-size`, and assert flash-footprint / source-text
# invariants. They run on every `cargo test --workspace` and protect the
# current legacy 32 KB bench linker region against silent growth. They do not
# close Draft 1.1's FLASH or RAM/stack gates.

[dependencies]

[dev-dependencies]
tempfile = "3"
# Frozen §5 flash-geometry registry: the draft09 envelope constants that
# agree with it (BANK1_BASE, FSBL_SPAN, FSBL_MAX_LOAD_SPAN) are consumed
# from here (Foundation A slice FA-1.1, issue #540).
pqsigner-geometry = { path = "../geometry" }
# `px_fingerprint`: the pixel-UI engine renders the reference frames the FSBL's
# `px-fingerprint` composer must match, and the full wordlist checks the
# FSBL's suffix stream.
pqsigner-ui-px = { path = "../pqsigner-ui-px", features = ["std"] }
sphincs-tz-bip39 = { path = "../bip39", features = ["full-wordlist"] }
