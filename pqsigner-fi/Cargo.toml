[package]
name = "pqsigner-fi"
version = "0.1.0"
edition.workspace = true
description = "PQSigner fault-injection (FI) hardening primitives — shared by `secure` (TrustZone secure-world) and `fsbl` (first-stage bootloader). Pure-logic, no_std, no_alloc. Caller supplies its own RNG via a `FnMut() -> u8` closure: secure-world plugs in the STM32 TRNG, FSBL plugs in a deterministic stub."

[dependencies]
zeroize = { workspace = true }

# Only needed for the ARM-target `wfe()` halt loop in `halt_on_glitch`; host
# test builds use a panic instead, so they don't drag in the cortex-m crate.
[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = { workspace = true }
