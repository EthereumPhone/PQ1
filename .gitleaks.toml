# gitleaks configuration for PQ1.
#
# WHY: GitHub's native secret scanning + push protection cover a limited set of
# provider token formats and never scan history. This repo is key-adjacent (SE
# transport credentials, a firmware signing key, CI API keys), so a leaked
# secret is an existential event, not an inconvenience. gitleaks is the
# history-capable, format-agnostic second layer.
#
# BASELINE (established 2026-07-31 — full `--log-opts=--all` scan of 4754
# commits / 535 MB): 4372 raw hits, ZERO real secrets. Every hit fell into the
# four families allowlisted below, and with this config the same scan reports
# 0. That is the contract: **this file is tuned so that a clean scan means
# clean.** If a scan ever reports a hit, treat it as real until proven
# otherwise — rotate first, triage second — and only then decide whether it
# belongs in an allowlist.
#
# The allowlists are deliberately narrow. Note in particular that bare 64-hex
# strings are NOT globally allowlisted: an Ethereum private key and a seed are
# both 64 hex, so that detection stays live everywhere except the three
# enumerated test-vector files.
#
# Run it:
#   gitleaks git . -c .gitleaks.toml --log-opts=--all     # full history
#   gitleaks dir . -c .gitleaks.toml                      # working tree
# CI runs this from .github/workflows/workflow-security.yml.

[extend]
useDefault = true

# Public proof-file SHA256s are not credentials. Restrict these exceptions to
# the generic heuristic, the exact artifact paths, AND the full matched field
# shape. Other credential assignments in the same files remain detectable.
# Validated against gitleaks 8.24.0: 51 existing false positives, no new matches
# in the digest-bridge change; ordinary keys and cross-path mutations stay red.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "EasyCrypt source-file digest bindings"
condition = "AND"
paths = ['''^contracts/verification/easycrypt/c10-port/cert-source-binding\.json$''']
regexTarget = "match"
regexes = [
  '''^[A-Za-z][A-Za-z0-9_]*\.eca?": "[0-9a-f]{64}"$''',
  # Public SHA256s of the two newly pinned Lean secret-derivation specifications.
  '''^(ForsSecretSpec|WotsSecretSpec)\.lean": "[0-9a-f]{64}"$''',
]

[[rules.allowlists]]
description = "Exact public digest and full key of the authentication-path proof-control source"
condition = "AND"
paths = ['''^contracts/verification/easycrypt/c10-port/cert-source-binding\.json$''']
regexTarget = "line"
regexes = ['''^\s*"contracts/verification/scripts/test_fors_auth_proof_controls\.py": "(2b2380a9baf8bd6bf5f863f0220d10ca5df28d269518c8d6c299d6f5c3c95ed5|368fb691e422e2e57d558f16c8e18e463888e4d4bb2a9c775e840848668ce850)",?\s*$''']

