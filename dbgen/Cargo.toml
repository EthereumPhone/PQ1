[package]
name = "dbgen"
version = "0.1.0"
edition.workspace = true
publish = false

[[bin]]
name = "dbgen"
path = "src/main.rs"

[dependencies]
sphincs-tz-shared = { path = "../shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
# Host-side Poseidon over BLS12-381 for the parallel ERC20 Merkle tree
# the CowSwap EIP-712 v3 circuit indexes. PKA feature is off since this
# crate runs on the host, not the STM32U585.
bls12_381 = { package = "bls12_381_pka", path = "../bls12_381_pka", default-features = false, features = ["groups", "pairings"] }
