[package]
name = "c10-ar-host"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
# Track-B variant: keygen fills + confirms the top-layer cache; every pass signs through it.
topcache = ["sphincs-c10/top-cache"]

[dependencies]
sphincs-c10 = { path = "../../../sphincs-c10", features = ["hw-sha256-oneshot", "hw-sha256-chain", "hw-sha256-search", "hw-sha256-prfchain", "hw-sha256-forsleaf", "hw-sha256-forstree", "hw-sha256-grindr", "hw-sha256-thmulti"] }
sha2 = { version = "0.10", default-features = false }
hex = "0.4"

[profile.release]
opt-level = 3
