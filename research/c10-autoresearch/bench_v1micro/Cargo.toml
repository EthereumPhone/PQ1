[package]
name = "c10-bench-v1micro"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[workspace]

[features]
# Block-0 window probe instead of the entry set.
win = []
# Stale-DCIS control for the v1 key entry: must halt through the fault hook (stage 300);
# the positive variant clears the digest first and completes (stage 301).
stale = []
stale-positive = ["stale"]
stale-fors = ["stale"]
stale-search = ["stale"]
# Round 14: two residue positive controls (frame copy; a key word at sp - 4) after the 7 cases.
residue-control = []

[dependencies]
# The v1 kit image's driver configuration (as bench_avg_v1).
pqsigner-hw = { path = "../../../hw", features = ["oneshot", "unrolled-io", "inline-barriers", "init-restart", "chain", "search", "gather", "prfchain", "forsleaf", "hra-ldm", "v1-asm-chain", "v1-asm-key", "v1-asm-key-ga", "v1-asm-fors", "v1-asm-fors-ga", "v1-asm-search", "v1-asm-search-ga", "v1-grindr"] }
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true

[profile.release.package.pqsigner-hw]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.c10-bench-v1micro]
opt-level = 3
