[package]
name = "c10-ar-host"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
# Track-B variant: keygen fills + confirms the top-layer cache; every pass signs through it.
topcache = ["sphincs-c10/top-cache"]
# RESEARCH (format-options check): candidate v2 format variants.
ts200 = ["sphincs-c10/v2-ts200"]
prf2 = ["sphincs-c10/v2-prf2"]
split810 = ["sphincs-c10/v2-split810"]

[dependencies]
sphincs-c10 = { path = "../../../sphincs-c10", features = ["hw-sha256-oneshot", "v2"] }
sha2 = { version = "0.10", default-features = false }
hex = "0.4"

[profile.release]
opt-level = 3
