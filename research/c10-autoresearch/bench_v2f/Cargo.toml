[package]
name = "c10-bench-v2f"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[workspace]

[features]
asm = ["pqsigner-hw/v2-asm-chain"]
# RESEARCH (format-options check): candidate v2 format variants (sphincs-c10 + matching driver).
ts200 = ["sphincs-c10/v2-ts200"]
prf2 = ["sphincs-c10/v2-prf2", "pqsigner-hw/v2-prf2"]
split810 = ["sphincs-c10/v2-split810", "pqsigner-hw/v2-split810"]
# Measurement variant: the product's UI tick after every digest (pqsigner-hw/tick-hook), with a stub that
# runs film_tick_hash's live-film counter path (load, add, store, every 64th call an out-of-line no-op).
tick = ["pqsigner-hw/tick-hook"]
tick-batch = ["tick", "pqsigner-hw/tick-batch", "sphincs-c10/hw-sha256-tickbatch"]
no-busy-wait = ["pqsigner-hw/no-busy-wait"]
hra-ldm = ["pqsigner-hw/hra-ldm"]

[dependencies]
# The secure image's hashing configuration (secure/Cargo.toml feature `hw-sha256`, minus the
# UI-only `tick-hook`): one-call digests, unrolled DIN/HR I/O, inlined barriers, INIT-only restart.
sphincs-c10 = { path = "../../../sphincs-c10", features = ["hw-sha256", "hw-sha256-oneshot", "v2-fused"] }
pqsigner-hw = { path = "../../../hw", features = ["oneshot", "unrolled-io", "inline-barriers", "init-restart", "hra-ldm", "v2", "v2-asm-chain", "v2-asm-key-ga", "v2-asm-search", "v2-asm-fors"] }

# Mirror of the root workspace's shipping [profile.release] (Cargo.toml), including the
# per-package opt-level 3 overrides. Changing this is an experiment, not a harness change.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
overflow-checks = true
panic = "abort"
debug = false

[profile.release.package.sphincs-c10]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.hmac]
opt-level = 3
[profile.release.package.pqsigner-hw]
opt-level = 3
