[package]
name = "c10-probe-pbkdf2"
version = "0.1.0"
edition = "2021"
publish = false
[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"
[workspace]
[dependencies]
sphincs-tz-bip39 = { path = "../../../bip39", features = ["fast-pbkdf2-asm"] }
sha2 = { version = "0.10", default-features = false }
pqsigner-hw = { path = "../../../hw", features = ["oneshot", "unrolled-io", "inline-barriers", "init-restart"] }
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
overflow-checks = true
panic = "abort"
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.hmac]
opt-level = 3
[profile.release.package.sphincs-tz-bip39]
opt-level = 3
