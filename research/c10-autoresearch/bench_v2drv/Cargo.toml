[package]
name = "c10-bench-v2drv"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[workspace]

[features]
asm = ["pqsigner-hw/v2-asm-chain"]
# RESEARCH (format-options check): the driver variants under test.
prf2 = ["pqsigner-hw/v2-prf2"]
split810 = ["pqsigner-hw/v2-split810"]
# Control: end with an out-of-range subtree call, which must halt through the
# driver's fault hook (status HALT|0x00F0, stage 200) instead of returning.
guard = []
stale = []
stale-positive = ["stale"]
stale-search = ["stale"]

[dependencies]
# The kit image's driver configuration (as bench_avg_v2f), against software SHA-256.
pqsigner-hw = { path = "../../../hw", features = ["oneshot", "unrolled-io", "inline-barriers", "init-restart", "hra-ldm", "v2", "v2-asm-chain", "v2-asm-search", "v2-asm-fors"] }
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true

[profile.release.package.pqsigner-hw]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
