[package]
name = "pqsigner-hal"
version = "0.1.0"
edition.workspace = true

# Trait-only HAL surface for PQSigner OS — every peripheral the secure
# world consumes is described here as a trait so future driver impls
# (`pqsigner-hal-stm32u5`, `pqsigner-hal-mock`, future backup-MCU
# ports) plug in without per-call-site `cfg`s.
#
# The trait surface here is the specification. Driver implementations
# in sibling crates MUST match these signatures verbatim.

[dependencies]
# `no_std`, no allocator, zero hardware deps. Trait crate only.

[dev-dependencies]
# Compile-time assertions used by `tests/` to lock down which traits
# `KeySelector` and friends do / do NOT implement (e.g. `KeySelector`
# must NOT impl `Debug` because the `Software` variant would leak its
# key reference — the intent is documented in `src/lib.rs` and the
# tests pin it.)
static_assertions = "1.1"
