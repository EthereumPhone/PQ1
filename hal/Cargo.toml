[package]
name = "pqsigner-hal"
version = "0.1.0"
edition.workspace = true

# Trait-only HAL surface for PQSigner OS — every peripheral the secure
# world consumes is described here as a trait so future driver impls
# (`pqsigner-hal-stm32u5`, `pqsigner-hal-mock`, future backup-MCU
# ports) plug in without per-call-site `cfg`s.
#
# Phase 6 PR 1 of the modularity refactor — the trait definitions land
# here first; PR 2 (`hal-stm32u5/` moves the existing `secure/src/hw/`
# drivers into the impl crate), PR 3 (`hal-mock/` provides MockPlatform
# for unit tests + QemuPlatform), and PR 4 (`secure/src/platform.rs`
# selects between the two) are sequenced in `docs/handoff-modularity-
# refactor.md` §4.2.
#
# Until the impl crates land, the trait surface here is the
# specification — new drivers MUST implement these traits, even though
# the existing code in `secure/src/hw/*` continues to be called via
# direct paths during the migration.

[dependencies]
# `no_std`, no allocator, zero hardware deps. Trait crate only.
