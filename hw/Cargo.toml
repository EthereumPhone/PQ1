[package]
name = "pqsigner-hw"
version = "0.1.0"
edition.workspace = true
description = "STM32U585 peripheral drivers shared by the secure world and the FSBL — typed MMIO plus the HASH (SHA-256) accelerator."

# WHY THIS CRATE EXISTS. The HASH driver was secure-world-only until the FSBL
# needed it too: `sha2::sha256::compress256` is 7,202 B, 23.4% of a 32 KiB FSBL
# image with 2,048 B free, and it only leaves the binary if every SHA-256
# consumer moves onto the peripheral (#758 option (d), measured at -8,568 B).
#
# The alternative was a second copy of a 400-line security-critical driver in
# `fsbl/`. This tree keeps finding two-drifting-copies defects — the 10 s vs 4 s
# fingerprint hold, the FSBL/secure manifest addresses — so a second copy of the
# thing that measures the firmware was not acceptable.

[dependencies]
cortex-m = { workspace = true }

[features]
default = []
# Emit semihosting diagnostics from the HASH timeout paths. Gated because the
# FSBL has no semihosting and every byte counts there. `hprintln!` without a
# debugger issues a BKPT that HardFaults on real silicon, so even when enabled
# the calls go through a DHCSR.C_DEBUGEN probe.
debug-log = ["dep:cortex-m-semihosting"]
# Call the secure world's `pqsigner_hash_tick` after every finished digest
# (its busy film draws from hash-bound work). Secure image only: the FSBL
# builds alone (`make fsbl`, its own target dir) and never enables it.
tick-hook = []
# Dev only: time each digest's stages on DWT_CYCCNT (`hash::probe`). The FSBL
# never names it and the secure `nsc/mod.rs` fence keeps it out of shipping.
hash-probe = []
# Dev only: compare every digest with software SHA-256 and fault on any
# difference. The software half is the linking binary's (`pqsigner_xcheck_*`,
# the secure world), so this crate takes no `sha2` edge and `Cargo.lock` does
# not move. The FSBL never names it; the secure fence keeps it out of
# shipping. Mutually exclusive with `hash-probe` (the software hash would
# land in its stages).
hw-sha256-crosscheck = []
# Secure image only (autoresearch): the WOTS chain loop in the driver (`pqsigner_sha256_chain16`).
# Requires `init-restart` (its per-step sequence is that feature's).
chain = ["init-restart", "oneshot"]
# Secure image only (autoresearch): the WOTS+C count search in the driver (`pqsigner_sha256_search128`).
search = ["init-restart", "oneshot"]
# Secure image only (autoresearch): th / th_pair over their parts in place (`pqsigner_sha256_{3,4}x32_16`).
gather = ["init-restart", "oneshot"]
# Secure image only (autoresearch): WOTS secret + chain in one call (`pqsigner_wots_prf_chain16`).
prfchain = ["chain"]
# Round 7: hand-scheduled v1 WOTS chain loop (secure-only, output-identical; same checks).
v1-asm-chain = ["chain"]
# Round 8: whole-key v1 WOTS loop (PRF + chains of the keygen shape) in asm (secure-only, output-identical; same checks).
v1-asm-key = ["v1-asm-chain", "prfchain"]
# Round 8: v1 FORS subtree with asm digest transitions (PRF / leaf / node), tree logic in Rust (secure-only, output-identical).
v1-asm-fors = ["forsleaf"]
# Round 8: v1 count search (search128, WOTS-shaped zero words) in asm; the predicate callback is called from the loop (secure-only, output-identical).
v1-asm-search = ["search"]
# Round 8: the v1 R grind (PRF + h_msg per nonce) as one driver call (secure-only, output-identical).
v1-grindr = ["search"]
# Secure image only (autoresearch): FORS secret + leaf hash in one call (`pqsigner_fors_leaf16`).
forsleaf = ["gather"]
# Autoresearch product variant: the driver's fused loops report finished digests in batches
# (`pqsigner_hash_tick_n`) instead of calling the UI tick after every digest.
tick-batch = ["tick-hook"]
# MEASUREMENT ONLY: chain steps write INIT without waiting for BUSY to clear after DCIS.
no-busy-wait = []
# Autoresearch: HR0..3 through the HRA alias with one load-multiple.
hra-ldm = []
# RESEARCH (#1155): C10 v2 one-block entries (`pqsigner_v2_*`).
v2 = ["init-restart", "oneshot", "prfchain", "forsleaf", "search"]
# RESEARCH (format-options check, 2026-11-13), must match sphincs-c10's feature of the same name:
# prf2 = one PRF digest -> two secrets in the WOTS/FORS entries; split810 = A7 ci at bits 22..17.
v2-prf2 = ["v2"]
# Round 7: hand-scheduled v2 chain loop (output-identical; same checks).
v2-asm-chain = ["v2"]
# Round 7: hand-scheduled v2 count search (output-identical; same checks).
v2-asm-search = ["v2"]
# Round 7: FORS subtree with asm digest transitions (output-identical; same checks).
v2-asm-fors = ["v2"]
# Round 7: the fold-multiply digit sum in the Rust search (137 -> 126 cycles/try; asm gives 114).
v2-fold-sum = ["v2"]
v2-split810 = ["v2"]
# Unrolled DIN feed and HR read-out. Secure image only: the FSBL keeps the
# rolled loops so its bytes, and the silicon boot proof taken on them, stand.
unrolled-io = []
# Inline `dsb`, and drop the barriers between two writes to the HASH
# peripheral itself (CR before DIN, NBLW before DCAL), which Device-memory
# ordering already covers. Secure image only, as `unrolled-io`.
inline-barriers = []
# `pqsigner_sha256_oneshot`: init, one update and final in a single call,
# for `sphincs-c10`'s `sha256_bytes` (its `hw-sha256-oneshot`). Secure image
# only, as `unrolled-io`.
oneshot = []
# Start each digest with HASH_CR.INIT alone, no RCC HASHRST pulse (the
# reset moves to `hash::scrub`, which every secure-world wipe calls), with
# a back-to-back boot self-test through both entry points. Secure image
# only, as `unrolled-io`; the FSBL keeps the per-digest reset.
init-restart = ["oneshot"]

[dependencies.cortex-m-semihosting]
workspace = true
optional = true
