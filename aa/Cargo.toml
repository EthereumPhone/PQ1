[package]
name = "pqsigner-aa"
version = "0.1.0"
edition.workspace = true

# ERC-4337 v0.6 UserOperation hash construction + EIP-1271 / Solady
# nested-EIP-712 PersonalSign hash construction. Pure-logic, no_std,
# zero hardware deps. Phase 5 PR 5.2 of the modularity refactor — see
# `docs/archive/handoff-modularity-refactor.md` §4.1.
#
# Used by both the secure crate (cmd_sign_userop, cmd_sign_userop_batch,
# cmd_sign_offchain) and any future host-side reference signer.

[dependencies]
pqsigner-proto    = { workspace = true }
pqsigner-tx-core  = { workspace = true }
sha2 = { version = "0.11", default-features = false }
sha3 = { version = "0.10", default-features = false }

[dev-dependencies]
hex = { workspace = true }

# `#[cfg(kani)]` proof harnesses in userop.rs; the workspace check-cfg
# registers `kani`/`lean_extract` so non-Kani builds don't warn.
[lints]
workspace = true
