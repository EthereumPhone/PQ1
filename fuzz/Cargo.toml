[package]
name = "pqsigner-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
description = "libFuzzer harnesses for PQSigner's pure-logic parsers."

# Stand-alone workspace: kept *outside* the main PQSigner workspace
# (`Cargo.toml` lists `fuzz/` under `workspace.exclude`). Reasons:
#   (a) cargo-fuzz requires nightly + libFuzzer + sanitizers; the rest of
#       the workspace builds on stable for `thumbv8m.main-none-eabi` and a
#       host-side `cargo test`. Mixing toolchains in one workspace is
#       painful and triggers spurious rebuilds.
#   (b) `[package.metadata.cargo-fuzz] = true` and the `[[bin]]` entries
#       below are only meaningful to the `cargo-fuzz` driver — they don't
#       belong in the main workspace's build graph.
[workspace]

# Keep ClusterFuzzLite's optimized (`cargo fuzz build -O`) binaries aligned
# with the shipping firmware's arithmetic semantics. Without this explicit
# standalone-workspace profile, `-O` disables overflow checks and makes the
# continuous campaign blind to secure-world panic/DoS paths that production
# would take.
[profile.release]
overflow-checks = true

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Workspace pure-logic crates — each is `no_std` + no-alloc-friendly and
# builds cleanly for host (the workspace already exercises them in
# `secure/src/fuzz_props.rs` proptests; this is the coverage-guided
# variant the trezor-comparison §2.4 action list calls out).
pqsigner-aa       = { path = "../aa" }
pqsigner-tx-core  = { path = "../tx-core" }
pqsigner-tx       = { path = "../tx" }
pqsigner-erc7730  = { path = "../pqsigner-erc7730" }
sphincs-tz-shared = { path = "../shared" }

# Prevent libFuzzer / asan from being built with sanitizer flags that
# leak into the workspace crates — cargo-fuzz handles this via its
# wrapper. No further config needed here.

# Host-runnable tests in `tests/` that validate the harness's static
# structure (Cargo.toml ↔ fuzz_targets/ consistency) and re-invoke
# every parser the fuzz_targets call with pathological inputs to prove
# the API surface hasn't drifted. None of these are linked into the
# libFuzzer bins.
[dev-dependencies]
toml             = "1.1"
pqsigner-proto   = { path = "../proto" }
sphincs-tz-shared = { path = "../shared" }
# DEV-ONLY EVM ground-truth oracle for the multiSend record-walk
# differential (`tests/multisend_record_walk_differential.rs`). revm runs
# the real MultiSendCallOnly bytecode so the host-extracted `MsRecordIter`
# is checked against the chain's actual record dispatch — NEVER a firmware
# dependency (this is the `workspace.exclude`'d fuzz crate, and these are
# dev-deps not compiled into any `cargo fuzz` libFuzzer target).
revm             = "41"
hex              = "0.4"
# Seed generator for `erc7730_render_dispatch` (`tests/gen_render_seeds.rs`,
# `#[ignore]`d): compiles the real ERC-7730 registry into IR leaves so the
# render fuzzer starts from valid descriptors instead of exploring parse-fail.
# dbgen → pqsigner-erc7730 (already a dep here); no cycle.
dbgen            = { path = "../dbgen" }

[[bin]]
name = "aa_userop_parse_header"
path = "fuzz_targets/aa_userop_parse_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tx_core_rlp_decode_item"
path = "fuzz_targets/tx_core_rlp_decode_item.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tx_core_eip1559_parse"
path = "fuzz_targets/tx_core_eip1559_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tx_erc20_parse_calldata"
path = "fuzz_targets/tx_erc20_parse_calldata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tx_erc20_verify_bundle"
path = "fuzz_targets/tx_erc20_verify_bundle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "apdu_parse_header"
path = "fuzz_targets/apdu_parse_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hid_frame_assembler"
path = "fuzz_targets/hid_frame_assembler.rs"
test = false
doc = false
bench = false

[[bin]]
name = "erc7730_verify_bundle"
path = "fuzz_targets/erc7730_verify_bundle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "erc7730_ir_parse"
path = "fuzz_targets/erc7730_ir_parse.rs"
test = false
doc = false
bench = false


# FULL ERC-7730 render dispatch — IR parse → find_format_by_selector →
# per-FormatOp field render → `Pages` emission (the on-device confirm
# screen). The renderer moved to `pqsigner_erc7730::display::render`
# (docs/erc7730-renderer-fuzzability.md), so this harness host-links and
# drives `render_erc7730_pages` itself. Seed its corpus first with
# `make fuzz-seed-erc7730-render` (the current generated pinned IR corpus). The
# field formatters are only reached once a descriptor parses, which
# random bytes do almost never. Coverage is root/source-tree specific; the
# current-root campaign status lives in docs/erc7730-renderer-fuzzability.md. The
# Pages-independent byte-writers are ALSO fuzzed in isolation by
# `erc7730_display_primitives` below.
[[bin]]
name = "erc7730_render_dispatch"
path = "fuzz_targets/erc7730_render_dispatch.rs"
test = false
doc = false
bench = false

# The display *primitives* — the pure row-buffer byte-writers
# (`pqsigner_erc7730::display::primitives`) that scale an
# attacker-controlled `U256` (from calldata) into a 16-col row under
# `overflow-checks = true`. A slip there is a panic = DoS on the trusted
# display; the descriptor-side harnesses above never reach this byte
# arithmetic. See `docs/erc7730-renderer-fuzzability.md`.
[[bin]]
name = "erc7730_display_primitives"
path = "fuzz_targets/erc7730_display_primitives.rs"
test = false
doc = false
bench = false

# Strict Safe `multiSend` decoder (`pqsigner_tx::multisend`): outer-frame
# decode + per-record walk. The DELEGATECALL-into-MultiSendCallOnly shape the
# Safe UI emits; every record must decode exactly or the tx refuses (a
# DELEGATECALL is never blind-signed). Complements the in-crate Kani proofs.
[[bin]]
name = "multisend_decode"
path = "fuzz_targets/multisend_decode.rs"
test = false
doc = false
bench = false

