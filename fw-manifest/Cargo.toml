[package]
name = "fw-manifest"
version = "0.1.0"
edition.workspace = true
description = "PQSigner firmware-update manifest format — shared by FSBL, secure firmware, and the vendor release-signing tool."

# This crate is deliberately no_std and no_alloc so it can be consumed by
# the FSBL (which has a 32 KB budget and no heap) and by host tools
# (fwsign, fwmeasure) alike. The manifest layout is the single source of
# truth for the firmware-update wire contract; changing it is a breaking
# change that invalidates every already-signed release bundle.

[dependencies]
sha2 = { version = "0.10", default-features = false }
sphincs-c10 = { workspace = true }
# Frozen §5 flash-geometry registry (Draft 1.1, post-errata-4). no_std,
# zero-dependency — compatible with the FSBL's 32 KB budget. Consumed only
# for the compile-time MANIFEST_SIZE == PAGE_SIZE agreement check (Foundation
# A slice FA-1.1, issue #540); the legacy 58/64-page slot capacities below
# stay literal until the cutover slice.
pqsigner-geometry = { path = "../geometry" }
# Constant-time byte comparisons for the vendor-fingerprint check
# (`verify_vendor_fpr`). The compared value is itself public, so the
# leak is hygiene-only, but a security-critical verify path has no
# business with a short-circuiting `==`.
subtle = { version = "2", default-features = false }

[features]
default = []
# Route every SHA-256 call through the `pqsigner_sha256_{init,update,final}`
# symbols the linked binary supplies, instead of the software `sha2`
# implementation — same contract as `sphincs-c10`'s feature of the same name.
# Device-only: host tools have no HASH peripheral and must stay on the default.
# The point is size, not just speed: `sha2::compress256` is 7,202 B and only
# disappears from the FSBL if this crate, `fsbl/src/verify.rs` and
# `sphincs-c10` all stop referencing it.
hw-sha256 = []
# Enables `std::io`-based helpers (currently only used by the host
# `fwsign` tool). FSBL and the secure firmware never turn this on.
std = []

[dev-dependencies]
# Property-based fuzz harness in `src/lib.rs::fuzz_props`. The manifest
# is the first thing a malicious USB host can drop on the firmware-
# update path (CMD_FW_BEGIN), so every parser/verifier path must
# terminate without panic for arbitrary 8 KB byte input. Host-only;
# never compiled into FSBL or device firmware.
proptest = "1"
# Extraction-differential generator (`tests/gen_extract_vectors.rs`): the
# format_decimal vectors execute the SHIPPED
# `pqsigner_tx_core::eip1559::u256_format_decimal` as ground truth for
# `contracts/verification/extracted` (`make verify-extract-differential GEN=1`).
# Dev-only; fw-manifest proper never links tx-core.
pqsigner-tx-core = { workspace = true }

# `#[cfg(kani)]` proof harnesses in lib.rs; the workspace check-cfg
# registers `kani`/`lean_extract` so non-Kani builds don't warn.
[lints]
workspace = true
