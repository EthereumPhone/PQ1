[package]
name = "sphincs-wallet"
version = "0.1.0"
edition = "2021"

[dependencies]
# SPHINCS+C7 (post-quantum keccak256-based signatures)
sphincs-c7 = { path = "../sphincs-c7" }
sha3 = "0.10"

# TROPIC01 secure element driver (master has r_mem_data_write/read)
tropic01 = { git = "https://github.com/tropicsquare/libtropic-rs", features = ["keys"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zerocopy = "0.8"

# RNG for x25519-dalek (needs rand_core 0.6)
rand_core = { version = "0.6.4", features = ["getrandom"] }

# USB serial communication (for TS1302 devkit)
serialport = "4.7.0"
embedded-hal = "1"

# PIN-based key encryption (chip-bound via MAC-and-Destroy)
aes-gcm = "0.10"
sha2 = "0.10"
libc = "0.2"

# Utilities
anyhow = "1"
env_logger = "0.11"
log = "0.4"

