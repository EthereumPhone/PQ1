[package]
name = "sha2"
version = "0.10.9"
edition = "2018"
build = false
autotests = false
autobenches = false
autoexamples = false
[workspace]
[lib]
path = "src/lib.rs"
[dependencies]
cfg-if = "=1.0.4"
digest = "=0.10.7"
cpufeatures = "=0.2.17"
[features]
default = []
force-soft = []
[profile.dev]
opt-level = 0
debug = false
incremental = false
overflow-checks = true
[patch.crates-io]
generic-array = { path = "../generic-array-corrected" }
