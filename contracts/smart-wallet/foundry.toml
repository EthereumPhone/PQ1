[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.23"
evm_version = "prague"
via_ir = true
optimizer = true
optimizer_runs = 200
memory_limit = 1073741824
fs_permissions = [{ access = "read", path = "test/" }]

[profile.deploy]
optimizer = true
optimizer_runs = 999999
via_ir = true
evm_version = "prague"
solc_version = "0.8.23"

[fmt]
sort_imports = true
wrap_comments = true
