[package]
name = "sphincs-tz-nonsecure"
version = "0.1.0"
edition.workspace = true

[features]
default = []
# Non-interactive automated end-to-end test mode. Replaces the
# default interactive main() with a scripted runner that exercises
# all four trust levels (value transfer, ERC20 known, BLIND SIGN,
# ZK clear sign) in sequence and prints PASS/FAIL lines a host
# harness can grep.
e2e-test = []
stm32u585 = ["sphincs-tz-shared/stm32u585"]  # Real STM32U585 hardware target (vs QEMU mps2-an505)
usb = ["dep:usb-device", "dep:synopsys-usb-otg"]  # USB HID for host communication

[dependencies]
sphincs-tz-shared    = { workspace = true }
cortex-m             = { workspace = true }
cortex-m-rt          = { workspace = true }
cortex-m-semihosting = { workspace = true }
panic-semihosting    = "0.6"
panic-halt = "1.0"

# USB HID (optional, for hardware builds with host communication)
usb-device = { version = "0.3", default-features = false, optional = true }
synopsys-usb-otg = { version = "0.4", features = ["cortex-m", "fs"], optional = true }
