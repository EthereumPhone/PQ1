[package]
name = "sphincs-tz-nonsecure"
version = "0.1.0"
edition.workspace = true

[features]
# Board axis — mirrors `secure/Cargo.toml`. The NS crate needs it only so the
# GTZC enforcement probe list can cover the peripherals a given board actually
# secures: pq1 gives the SE050 its own I2C4 bus, which iota2 has no equivalent
# of. Opt-in to pq1, same as the secure side; `board-iota2` is inert.
board-iota2 = []
board-pq1 = []

default = []
# Non-interactive automated end-to-end test mode. Replaces the
# default interactive main() with a scripted runner that exercises
# the sign-dispatch trust levels (value transfer, ERC20 known, blind
# sign, Safe / CoW clear-sign, ERC-7730 typed render, batch) in
# sequence and prints PASS/FAIL lines a host harness can grep.
#
# Enables panic-semihosting's `exit` feature so a failing assertion
# inside the test runner terminates QEMU (via SYS_EXIT) instead of
# spinning in `loop {}`. Without this, `make e2e` would hang forever
# on any panic and the captured output buffer would never flush.
e2e-test = ["panic-semihosting/exit"]
# Replaces the interactive main() with a DWT-timed sign-userop bench.
# Pairs with the secure crate's `e2e-test` feature (for auto-provision +
# pre-unlock) and `stm32u585` (for the 160 MHz PLL path). Hardware only —
# the QEMU transport has no DWT.  Use `make test-key-speed`.
bench-key-speed = []
# Replaces the interactive main() with the non-destructive firmware-
# update logic test runner. Pairs with the secure crate's `e2e-test`
# feature (pre-unlock). Exercises every CMD_FW_* surface without ever
# calling COMMIT (→ would burn an OTP bit) or letting BEGIN reach
# `flash::erase_slot` (→ on pre-A/B-split builds that would corrupt
# the running firmware). Use `make test-update-hw`.
fwup-hw-test = ["stm32u585"]
# Replaces the interactive main() with the GTZC1 TZSC + TZIC
# enforcement validation driver. Hardware only — QEMU mps2-an505 has
# no GTZC. Pairs with the secure crate's `e2e-test` feature (so the
# `nsc_tzic_status` CMSE veneer + `mock-se` pre-unlock skip is
# present) and `stm32u585`. Probes each NS-alias address of a
# peripheral marked SECURE in `sau.rs`, then reads back the TZIC
# counter and asserts. Use `make gtzc-enforcement-hw`.
gtzc-test = ["e2e-test", "stm32u585"]
# Slice 2 demo for the GTZC1 illegal-access → wipe escalation.
# Pairs with the secure crate's `tzic-wipe` feature. Replaces the
# interactive main() with a single-probe driver that would log a
# `SURVIVED` marker if the wipe path did not fire — its absence is
# the pass criterion. Hardware only. Use `make tzic-wipe-hw`.
tzic-wipe-test = ["stm32u585"]
stm32u585 = ["sphincs-tz-shared/stm32u585"]  # Real STM32U585 hardware target (vs QEMU mps2-an505)
usb = ["dep:usb-device", "dep:synopsys-usb-otg"]  # USB HID for host communication
# NS half of the IWDG USB-path hang watchdog. Mirrors the secure-side
# `iwdg` feature: bumps a heartbeat counter each poll-loop iteration +
# registers its address with the secure IWDG watcher at boot. Implies
# `stm32u585` (the `nsc_register_heartbeat` CMSE veneer only exists on
# hardware). MUST be built in lockstep with the secure `iwdg` feature.
iwdg = ["stm32u585"]
# Prodtest companion. Mirrors the secure-side `prodtest` feature so the
# NS-side `usb::commands` dispatcher routes `INS_V2_PRODTEST_*` codes
# to the CMSE veneers exposed under the same secure-side gate.
prodtest = ["stm32u585", "usb"]

[dependencies]
sphincs-tz-shared    = { workspace = true }
# FI-hardening primitives — `fi_min` for length-clamping in the USB
# response-queue copy path. See pqsigner-fi crate docstrings.
pqsigner-fi          = { path = "../pqsigner-fi" }
# fw-manifest is used only for the 8 KB MANIFEST_SIZE constant in the
# chain-buffer sizing and the CHUNK payload bounds check. No crypto
# imports on the NS side — all the verification happens in the secure
# world and NS only shuttles bytes.
fw-manifest          = { workspace = true }
cortex-m             = { workspace = true }
cortex-m-rt          = { workspace = true }
cortex-m-semihosting = { workspace = true }
panic-semihosting    = "0.6"
panic-halt = "1.0"
# SHA-256 for the names-DB short_key derivation. `sphincs-tz-shared`
# has a zero-dep policy so the hashing helper lives in each consumer.
sha2                 = { version = "0.10", default-features = false }
# Keccak-256 used by the e2e Safe-multisig scenario to assemble a
# `safe_v1` trailer (data_hash + safeTxHash) on the NS side. The
# companion app uses the same primitive in production.
sha3                 = { version = "0.10", default-features = false }

# USB HID (optional, for hardware builds with host communication)
usb-device = { version = "0.3", default-features = false, optional = true }
synopsys-usb-otg = { version = "0.4", features = ["cortex-m", "fs"], optional = true }
