[package]
name = "jardin-fosc"
version = "0.1.0"
edition.workspace = true
description = "JARDIN FORS+C compact post-quantum signatures (no_std, no alloc)"

[dependencies]
keccak-asm = { workspace = true }
zeroize = { workspace = true, features = ["zeroize_derive"] }

[features]
# Swap Keccak-256 for SHA-256 as the primary hash. Intended for embedded
# targets with a hardware SHA-256 accelerator (e.g. STM32U585 HASH).
# Under this feature the crate does NOT provide an implementation — the
# linked binary must define `pqsigner_sha256_init/update/final` (see
# `secure/src/hw/hash.rs`). Signatures are NOT cross-compatible with the
# Keccak variant; this is a speed-bench alternative, not a protocol change.
sha256-hash = []

[dev-dependencies]
hex = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
