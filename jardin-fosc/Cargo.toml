[package]
name = "jardin-fosc"
version = "0.1.0"
edition.workspace = true
description = "JARDIN FORS+C compact post-quantum signatures (no_std, no alloc)"

[dependencies]
sha3 = { version = "0.10", default-features = false }
zeroize = { workspace = true, features = ["zeroize_derive"] }

[dev-dependencies]
hex = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
