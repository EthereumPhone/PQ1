[package]
name = "sphincs-c10"
version = "0.1.0"
edition.workspace = true
description = "SPHINCS+C10 SHA-256-based post-quantum signatures (no_std, no alloc)"

[dependencies]
sha2 = { version = "0.10", default-features = false }
zeroize = { workspace = true, features = ["zeroize_derive"] }

[features]
# Route all hashing through extern `pqsigner_sha256_init/update/final`.
# Intended for embedded targets with a hardware SHA-256 accelerator (e.g.
# STM32U585 HASH). The linked binary must provide the three symbols; see
# `secure/src/hw/hash.rs`. Without this feature the crate uses software
# `sha2::Sha256`, which is what host tests need.
hw-sha256 = []
# `sha256_bytes` (a contiguous buffer) through one extern call,
# `pqsigner_sha256_oneshot`, instead of the three. Only the secure image has
# the symbol (`pqsigner-hw/oneshot`); the FSBL keeps the three-call path.
hw-sha256-oneshot = ["hw-sha256"]

# Atomic per-category hash-call counters (work-todo §18 SCA step a):
# count sk_seed-touching PRF calls (wots_secret / fors_secret) vs
# public tree/chain hashes per sign. Adds a relaxed atomic increment
# at the top of each hash primitive — measurement-only, never shipped.
hash-counters = []

# Re-export otherwise-`pub(crate)` internals (PRF, ADRS, digest, FORS tree
# helpers) under `sphincs_c10::sim_internals`, for the security-regression
# harnesses in `tests/` only: the FORS shared-forest forgery simulator
# (`fors_forgery_resistance.rs`) and the position-binding property test
# (`fors_position_binding.rs`), both guarding the fcee705a fix (CWE-347).
# Off by default so the production public API stays minimal; never shipped.
sim-internals = []

# Expose `sphincs_c10::near_miss` — a TEST-ONLY +C-gate near-miss vector
# generator. It produces signatures that reconstruct the correct pkRoot but
# fail ONLY the WOTS+C digit-sum gate (NM1) or the FORS+C forced-zero gate
# (NM2), so the Lean / Solidity KAT can SEE a gate's removal (the gates were
# previously only proof-guarded — see contracts/verification A3.1). Off by
# default; the production signer is unchanged (grinding stays on); never
# shipped. Consumed by `tests/gen_test_vectors.rs`.
near-miss-gen = []

# `--cfg lean_extract` is set ONLY by the Aeneas/Charon Lean-extraction
# run (work-todo §33 P0): it compiles out the UI progress-callback slot
# (an arrow type the extraction can't represent). Never set by any
# shipping build; CI must run this crate's test suite under the cfg too,
# pinning byte-equality between the extracted and shipped shapes.
[lints]
workspace = true

[dev-dependencies]
hex = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
static_assertions = "1.1"
