# Deliberate, owner-decided deviations of the DEVICE from the PQ-UI reference
# input/motion tokens (tools/pq-ui/handoff/spec/motion.json). `make
# pq-ui-port-diff` runs upstream's port_diff over the firmware's constants and
# fails on any MISMATCH not listed here — so a drift is a red build, and a
# listed deviation is a recorded decision, not an accident. Every entry names
# the decision and its evidence. See docs/security/HARDENING.md § 2.4.

# RETIRED 2026-09-30 — TAP_MAX_MS is no longer a deviation.
#
# The device deviated to 500 ms on 2026-09-22 (EVT #1: deliberate presses on
# the pq1 switches run 250-400 ms and were demoted to aborted holds). Upstream
# ADOPTED that value in 198bbcb9, so the reference now says 500 too and
# port_diff scores it MATCH. A [[deviation]] row for a token that no longer
# differs is itself drift: it would keep excusing a future MISMATCH on this
# token, which is the opposite of what this file is for. Recorded here rather
# than deleted silently, because the on-silicon evidence is still the reason
# the value is what it is.

# Grammar deviations that carry no numeric token (recorded here so the file
# is the single list; port_diff cannot see them):
#   * the sign gesture on the device is the two-button chord CLICK (both
#     down together, fires on release) - the reference signs on hold-right;
#   * hold-right is a no-op on the device; hold-left declines everywhere
#     (reference: same).

# Port step 4 (2026-09-23) — screens outside the sign dialog. Visual /
# mechanism deviations with no motion.json token (port_diff cannot see them);
# docs/ui/pixel-ui-port-plan.md § 4 has the reasons in full:
#   * PIN row: entered digits are masked (a filled dot in the white ring), the
#     reference shows the digit — the device keeps the 16x4 page's masking
#     (the page showed `*`; screens never show more than the page did);
#   * PIN row / letter row: the input grammar is the legacy entry loop's
#     (pin_entry.rs / seed_wizard.rs unchanged: tap -/+ dials, the chord or
#     hold-right ENTERs, hold-left goes BACK and cancels on the first slot) -
#     the reference binds BACK/NEXT to double presses; the hint row shows the
#     static `- ENTER (BOTH) +` (no 3 s pulse cycle, no ring bounce: the
#     entry loop paints once per button event);
#   * seed words: drawn by the constant-time cell run (fixed 14 px cells,
#     each glyph centred in its cell) - a monospaced setting of the
#     proportional Aileron face, F-24; three pages of eight words (the
#     reference grid), the 16x4 pages keep eight pages of three;
#   * verdicts: the die rests at the REST corner view (no tumble), the wipe
#     brush takes the pulse treatment (no swiffle), no lead films (no
#     explosion before WALLET WIPED / the firmware endings), LAST ATTEMPT
#     shows the 1 at the 36 px face (no 40 px SemiBold baked, no reel);
#   * boot: the fingerprint intro is a status screen on the fingerprint disc
#     and there is NO `firmware_verified` at boot (the secure world measures,
#     it does not verify); FIRMWARE VERIFIED is not claimed anywhere yet;
#   * firmware update: the fingerprint disc stands in for the download mark
#     (not baked); both fingerprints (image + signing key) get the words grid,
#     each announced by a detail screen; the returning ask repeats the
#     opening ask byte-for-byte (the firmware flow rule), not `CONFIRM UPDATE`.

# The long-tail token monogram's face (#774, 2026-10-01).
#
# `components.monogram` sets the initial at `font(MONOGRAM_SCALE * r, "bold")`
# — 1.34 x the 30 px disc radius, so ~40 px BOLD. The device has neither: the
# baked atlas tops out at 36 px and carries Regular + SemiBold only. A 40 px
# Bold tier of A-Z + 0-9 costs roughly 11 KB against the 2,648 B left in the
# 77,824 B NS atlas window, so it does not fit without reopening the flash
# lever (port plan § Flash, an owner decision).
#
# The device therefore sets the monogram in Regular 36, the largest face it
# has. MEASURED on the designer's own `send_token` render against ours, cap
# ink inside the disc:
#
#     reference (Bold ~40)   28 px = 48 % of the 58 px visible disc
#     device    (Regular 36) 25 px = 43 %
#
# Both sit inside V-MARKBAND's 39-60 %, which is the rule the size has to
# satisfy; `monogram_cap_is_inside_the_mark_band` measures it from the baked
# atlas on every run rather than trusting this note. What is lost is the
# WEIGHT: a Regular letter reads lighter than a mark, and the reference chose
# bold precisely so "a letter disc and a mark disc carry the same weight in a
# walk".
#
# REVISIT when the atlas window or the flash lever moves.
