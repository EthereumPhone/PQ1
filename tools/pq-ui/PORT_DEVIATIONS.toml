# Deliberate, owner-decided deviations of the DEVICE from the PQ-UI reference
# input/motion tokens (tools/pq-ui/handoff/spec/motion.json). `make
# pq-ui-port-diff` runs upstream's port_diff over the firmware's constants and
# fails on any MISMATCH not listed here — so a drift is a red build, and a
# listed deviation is a recorded decision, not an accident. Every entry names
# the decision and its evidence. See docs/security/HARDENING.md § 2.4.

# RETIRED 2026-09-30 — TAP_MAX_MS is no longer a deviation.
#
# The device deviated to 500 ms on 2026-09-22 (EVT #1: deliberate presses on
# the pq1 switches run 250-400 ms and were demoted to aborted holds). Upstream
# ADOPTED that value in 198bbcb9, so the reference now says 500 too and
# port_diff scores it MATCH. A [[deviation]] row for a token that no longer
# differs is itself drift: it would keep excusing a future MISMATCH on this
# token, which is the opposite of what this file is for. Recorded here rather
# than deleted silently, because the on-silicon evidence is still the reason
# the value is what it is.

# Grammar deviations that carry no numeric token (recorded here so the file
# is the single list; port_diff cannot see them):
#   * the sign gesture on the device is the two-button chord CLICK (both
#     down together, fires on release) - the reference signs on hold-right;
#   * hold-right is a no-op on the device; hold-left declines everywhere
#     (reference: same).

# Port step 4 (2026-09-23) — screens outside the sign dialog. Visual /
# mechanism deviations with no motion.json token (port_diff cannot see them);
# docs/ui/pixel-ui-port-plan.md § 4 has the reasons in full:
#   * PIN row: entered digits are masked (a filled dot in the white ring), the
#     reference shows the digit — the device keeps the 16x4 page's masking
#     (the page showed `*`; screens never show more than the page did);
#   * PIN row / letter row: the input grammar is the legacy entry loop's
#     (pin_entry.rs / seed_wizard.rs unchanged: tap -/+ dials, the chord or
#     hold-right ENTERs, hold-left goes BACK and cancels on the first slot) -
#     the reference binds BACK/NEXT to double presses; the hint row shows the
#     static `- ENTER (BOTH) +` (no 3 s pulse cycle, no ring bounce: the
#     entry loop paints once per button event);
#   * seed words: drawn by the constant-time cell run (fixed 14 px cells,
#     each glyph centred in its cell) - a monospaced setting of the
#     proportional Aileron face, F-24; three pages of eight words (the
#     reference grid), the 16x4 pages keep eight pages of three;
#   * verdicts: the die rests at the REST corner view (no tumble), the wipe
#     brush takes the pulse treatment (no swiffle), no lead films (no
#     explosion before WALLET WIPED / the firmware endings), LAST ATTEMPT
#     shows the 1 at the 36 px face (no 40 px SemiBold baked, no reel);
#   * boot: the fingerprint intro is a status screen on the fingerprint disc
#     and there is NO `firmware_verified` at boot (the secure world measures,
#     it does not verify); FIRMWARE VERIFIED is not claimed anywhere yet;
#   * firmware update: the fingerprint disc stands in for the download mark
#     (not baked); both fingerprints (image + signing key) get the words grid,
#     each announced by a detail screen; the returning ask repeats the
#     opening ask byte-for-byte (the firmware flow rule), not `CONFIRM UPDATE`.

# The long-tail token monogram's face (#774, 2026-10-01).
#
# `components.monogram` sets the initial at `font(MONOGRAM_SCALE * r, "bold")`
# — 1.34 x the 30 px disc radius, so ~40 px BOLD. The device has neither: the
# baked atlas tops out at 36 px and carries Regular + SemiBold only.
#
# MEASURED by baking the candidate tiers (A-Z + 0-9, 36 glyphs, bitmap +
# table), against the 2,648 B left in the 77,824 B NS atlas window:
#
#     Bold 40 (what the reference uses)   13,016 B
#     Bold 36                             10,904 B
#     SemiBold 36                         10,500 B
#     Regular 36 as a SEPARATE tier       10,266 B
#     Regular 36 reusing the shipped tier       0 B   <- what we do
#
# The cost is NOT the weight. A controlled pair already in the atlas settles
# that: Regular 22 and SemiBold 22, same 95-glyph charset, are 7,799 and
# 8,140 bytes — +4.4 %. At 36 px over the monogram charset Bold is +6.4 %
# over Regular. Glyphs are stored as their bounding box at 4 bits/px, so
# bytes track w*h/2; thicker stems widen the box (max glyph 35x28 bold vs
# 33x28 regular) and that is the whole difference.
#
# What costs 13 KB is adding a WHOLE TIER: 36 glyph bitmaps that exist in no
# face we ship. Regular 36 is free only because the shipped r36 tier already
# contains A-Z and 0-9 (the TRIM charset). The 40/36 size step is the other
# 20 % — area scales with the square of the size.
#
# OWNER DECISION 2026-10-02: the device does not use Bold at all. Regular 36
# stands. This is no longer a budget deferral waiting on the flash lever — if
# the atlas window grows, do NOT spend it re-adding Bold here.
#
# The budget is what RAISED the question; the decision does not rest on it.
# Bold has exactly one use in the whole design system — this monogram — and
# it is weight-matching, not meaning. The measurement below shows Regular 36
# already satisfies the rule the size has to obey, so the only thing bought
# by 13 KB would be a slightly heavier letter.
#
# The device therefore sets the monogram in Regular 36, the largest face it
# has. MEASURED on the designer's own `send_token` render against ours, cap
# ink inside the disc:
#
#     reference (Bold ~40)   28 px = 48 % of the 58 px visible disc
#     device    (Regular 36) 25 px = 43 %
#
# Both sit inside V-MARKBAND's 39-60 %, which is the rule the size has to
# satisfy; `monogram_cap_is_inside_the_mark_band` measures it from the baked
# atlas on every run rather than trusting this note. What is lost is the
# WEIGHT: a Regular letter reads lighter than a mark, and the reference chose
# bold precisely so "a letter disc and a mark disc carry the same weight in a
# walk".
#
# NOT a revisit item. Reopen only if the design system gives Bold a second,
# load-bearing use — weight alone is not one.
#
# ---------------------------------------------------------------------------
# SemiBold, by contrast, STAYS. Recorded here so a future atlas-budget pass
# does not read it as the same kind of saving.
#
# Asked and answered on the same day (2026-10-02) as the Bold decision above.
# Dropping sb22 + sb16 would free 12,458 B — but in the NS ATLAS window
# (2,648 B free today -> 15,106 B), and the atlas has no bytes in the secure
# image at all (no `include_bytes!` under secure/src/ui/px/; the secure world
# pins only its SHA-256). What blocks shipping is the SECURE slot, and that
# saving moves it by zero bytes. It would pay a real cost in the wrong
# currency.
#
# And the cost is real, because SemiBold is the design's semantic axis where
# Bold was decoration (pq1/typography.py): "Regular for every value; SemiBold
# for the label caps and every band-edge annotation [...] and for a NAME LINE
# INSIDE A VALUE".
#
# That last clause is load-bearing in the firmware. `screen_kit::addr` renders
# a SemiBold name over Regular address lines ONLY when the NameResolver
# verified the name:
#
#     Some(name) => [ (name, SemiBold), (addr.lines[0], Regular), ... ]
#     None       => the address alone
#
# So on a signing screen SemiBold means "this human-readable string came from
# the verified name DB, not from the companion". Dropping the weight folds
# that provenance cue into the body text. F-ELLIPSIS also makes "a resolved
# recipient under its SemiBold name" one of exactly TWO sanctioned address
# shortenings — the weight is what licenses showing a shortened address.
#
# If the NS atlas ever does bind, note the asymmetry before reaching for this:
# sb16 is 3,558 B (label caps) and sb22 is 8,900 B, but sb22 carries BOTH the
# resolved-name signal and the PIN entry digits. The bigger saving is the
# worse thing to lose.

# setup/first_run — the check-word INPUT METHOD, and slot_registered (#772).
#
# Upstream 198bbcb9 added `flows/setup/first_run` and two library screens.
# Checked against the device wizard step by step (2026-10-02): every step of
# that flow already exists here.
#
#     reference                      device
#     SET UP PQ1?                    seed_wizard::choose_setup_mode
#     SET PIN / REPEAT PIN           enter_pin_with_confirm
#     SET DURESS PIN / REPEAT        collect_duress_pin  ("Set duress PIN?",
#                                    "must differ", "Same as main",
#                                    "PIN mismatch") — §32 P4/P5
#     WRITE DOWN 24 WORDS            "Write 24 words"
#     the 24 WORDS                   show_mnemonic
#     WORDS WRITTEN DOWN?            "Words shown"
#     CHECK 3 / 12 / 22              verify_mnemonic (main.rs:988)
#     SETUP COMPLETE                 "Backup OK"
#
# So the two REAL differences, both presentational:
#
# 1. THE CHECK-WORD INPUT. The reference shows the asked word among eight
#    decoys in a 3x3 grid and the user PICKS; the device has the user ENTER
#    the word through the legacy entry loop (`enter_single_word`), the same
#    grammar the PIN and letter rows already deviate on (recorded above).
#
#    Kept deliberately. Both put secret material on the glass and both need
#    the F-24 constant-time cell run, so neither is obviously safer on that
#    axis — but the device's form renders ONE word where the grid renders
#    nine, and picking from a visible list is a weaker check of what the user
#    actually wrote down than reproducing it. The device also picks its three
#    probes at RANDOM per run (`pick_three_distinct`), where the reference's
#    3/12/22 are samples its own docstring calls variable.
#
#    REVISIT only as a deliberate ceremony change, with the F-24 treatment of
#    a nine-word grid designed first. It is not a conformance defect.
#
# 2. `screens/verdict/slot_registered` (audit HS-10) — a white disc carrying
#    the black rotate mark, for a slot the device has just registered. The
#    device states the same fact through the slot-rotation family's own
#    ending instead (`SLOT ROTATED`, the rotate disc, unbranded green). Using
#    the library verdict would ADD a screen to the sign flow rather than
#    re-dress one, which is a flow change, not a port gap.
#
# `flows/chains` is a bench / design-review flow by its own docstring ("No
# ENDS: nothing is signed here"), so it is not a port target at all.
