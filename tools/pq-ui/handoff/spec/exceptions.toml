# Known exceptions — the debt the conformance checker tolerates TODAY.
#
# The Sep-2026 consistency audit (handoff/REPORT.md) was report-only; `audit` is that
# report's finding id: nothing in
# pq1/, flows/ or screens/ was changed. Every violation it found is listed here,
# one block each, so a clean tree passes and any NEW violation fails.
#
# A row matches on rule + where + key (never a line number, so ordinary edits
# cannot orphan it). When you fix one, the checker reports the row as STALE —
# delete it. That is the ratchet: this file only ever gets shorter.
#
#   python3 -m tools.check            what is still open (exit 1 on anything new)
#   python3 -m tools.check --propose  blocks for a new violation you decide to accept
#
# Never add a row to silence a failure you have not discussed with the owner.

# --------------------------------------------------------------- verdict law --

[[known]]
rule = "V-ENTRANCE"
where = "pq1/status.py::ArriveStatus.draw"
key = "motion.arrive(u)"
audit = "D1-07"
reason = """ArriveStatus is a StatusAnim, not a VerdictAnim, so it cannot inherit entrance();
it re-implements the same two lines. Either lift entrance() to StatusAnim or have ArriveStatus
subclass VerdictAnim. Zero pixel change."""

[[known]]
rule = "V-ENTRANCE"
where = "screens/confirm/hold_to_confirm.py::HoldToConfirm._draw_cancel"
key = "motion.arrive(u)"
audit = "D1-07"
reason = """the cancel branch of the hold demo copies the entrance law's two lines for the same
reason as ArriveStatus. Fixed by the same lift. Zero pixel change."""

[[known]]
rule = "V-LAWCOPY"
where = "pq1/status.py::ArriveStatus"
key = "T_HOLD/T_IN/T_TEXT/T_WAIT"
audit = "D1-07"
reason = """ArriveStatus re-declares 400 / 300 / 450 / 300 instead of inheriting them. Same root
cause as its V-ENTRANCE row: it is a StatusAnim that behaves like a verdict."""

[[known]]
rule = "V-LAWCOPY"
where = "pq1/status.py::LedAnim"
key = "HANDOFF_MS"
audit = "D4-02"
reason = """the 400 ms handoff crossfade is declared three times (VerdictAnim.T_HOLD,
ArriveStatus.T_HOLD, LedAnim.HANDOFF_MS). They mean the same span and should be one token."""

# ------------------------------------------------------------ motion / curves --

[[known]]
rule = "M-EASE"
where = "pq1/loading.py::qubit_pose"
key = "(1 - uj) ** 2"
audit = "D3-06"
reason = """the qubit join uses a hand-rolled smoothstep ((1-u)^2 * (1+2u)) that is not in the
motion vocabulary. DESIGN.md § Motion says scripted motion uses named curves. Either name this
curve in motion.py or replace it with the nearest named one after a look at the render."""

[[known]]
rule = "M-EASE"
where = "pq1/procedural/burst.py::pose"
key = "(1 - u) ** 3"
audit = "D3-04"
reason = "an inlined ease_out inside the explosion — call motion.ease_out. Zero pixel change."

[[known]]
rule = "M-EASE"
where = "pq1/procedural/burst.py::draw"
key = "(1 - ru) ** cfg.grow_p"
audit = "D3-04"
reason = """an inlined decel with the ring's own exponent (2.6 major / 2.4 minor). motion.decel's
default p is 2.6 — the same curve, uncoupled. Call decel(ru, cfg.grow_p)."""

[[known]]
rule = "M-EASE"
where = "pq1/procedural/burst.py::_sides"
key = "(1 - i / n) ** SIDES_K"
audit = "D3-04"
reason = """the side-entrance arc's speed profile. This one is geometry (arc-length spacing along
a spiral), not a time easing — the rule catches it by shape. Keep, or move the helper into
motion.py so the exception disappears."""

[[known]]
rule = "M-UNUSED"
where = "pq1/motion.py"
key = "MOVE_MS"
audit = "D4-12"
reason = """MOVE_MS (900) is a legacy span estimate from before the springs; FADE_MS (180) is still
read by hold_to_confirm, MOVE_MS by nothing. Keep it as documentation of the old pace or delete it
— but it should not look like a live token."""

# -------------------------------------------------------------------- flows ---

[[known]]
rule = "F-DEFEND"
where = "flow:unlock_batch"
key = "DEFAULT_END=None"
audit = "D9-11"
reason = """unlock_batch is a splice demo (three library screens), not a transaction flow: it
declares ENDS = {locked} but no DEFAULT_END, so `python3 -m flows unlock_batch` renders the
no-end form. Give it DEFAULT_END = "locked", or document it as a demo that has none."""

# ------------------------------------------------------- schema validation ----

[[known]]
rule = "X-VALIDATE"
where = "pq1/layout.py::normalize_screens"
key = "kind='banner'"
audit = "G17-05"
reason = """an unknown kind is accepted and only fails later (or not at all). DESIGN.md
§ Screen schema says unknown names raise. Anims, results and states DO raise — kinds, sizes,
sides and chev values do not."""

[[known]]
rule = "X-VALIDATE"
where = "pq1/layout.py::normalize_screens"
key = "side='top'"
audit = "G17-05"
reason = "an unknown side is accepted silently; only left / right exist."

# ------------------------------------------------------------------ icon laws --
# V-CENTRE measures the optical-centre law: the ink's centre of MASS on the circle.
# These nine are the written exceptions — shapes whose mass is deliberately not
# their optical centre. Nothing below is a nudge waiting to be applied.

[[known]]
rule = "V-CENTRE"
where = "anim:verdict/tamper"
key = "centroid"
audit = "ICO-04"
reason = """the notice triangle is BOX-centred: its bounding box sits on the circle, and
two thirds of a triangle's area lies in its lower half, so the mass measures ~10 px low.
Centring the mass instead would float the apex above the grid every other sign sits on,
and the three notices would stop lining up with each other."""

[[known]]
rule = "V-CENTRE"
where = "anim:verdict/sig_error"
key = "centroid"
audit = "ICO-04"
reason = """the same notice triangle, docked in a detail column instead of centred — it is
measured against its own column centre and reads identically to tamper's (ICO-06 closed
the gap between them). Box-centred by the same decision."""

[[known]]
rule = "V-CENTRE"
where = "anim:verdict/tamper|firmware_tampered"
key = "centroid"
audit = "HS-10"
reason = """tamper's own triangle under a second caption (FIRMWARE TAMPERED) — the
anim:verdict/tamper row's decision, not a new exception: box-centred, never nudged."""

[[known]]
rule = "V-CENTRE"
where = "anim:verdict/sig_error|type1_sig_fail"
key = "centroid"
audit = "HS-10"
reason = """sig_error's own docked triangle with other lines (TYPE 1 SIG) — the
anim:verdict/sig_error row's decision, not a new exception: box-centred, never nudged."""

[[known]]
rule = "V-CENTRE"
where = "anim:verdict/wipe"
key = "centroid"
audit = "ICO-04"
reason = """WALLET WIPED's triangle, box-centred like tamper's; it sits a touch higher
because the wipe mark inside it carries ink the exclamation does not."""

[[known]]
rule = "V-CENTRE"
where = "anim:verdict/wipe|wallet_wiped_explosion"
key = "centroid"
audit = "ICO-04"
reason = """the same triangle led by the explosion film; the blast is long gone by the
resting frame, so what is measured is wipe's pose."""

[[known]]
rule = "V-CENTRE"
where = "anim:verdict/shield"
key = "centroid"
audit = "ICO-04"
reason = """both sources sit the mark about 2 px above the shield's centre, and the shield
keeps its OUTLINE — it is the container, the mark inside it is the verdict (the one
written exception to the filled-silhouette rule, owner decision, Sep 2026). Centring the
mass would drop the mark onto the shield's lower lobe, where the outline narrows."""

[[known]]
rule = "V-CENTRE"
where = "anim:verdict/shield|no_match"
key = "centroid"
audit = "ICO-04"
reason = "the same shield carrying the X instead of the check — the same 2 px, same reason."

[[known]]
rule = "V-CENTRE"
where = "anim:verdict/last_attempt"
key = "centroid"
audit = "ICO-04"
reason = """LAST ATTEMPT is not a sign at all: a display digit beside a heart, composed as
a PAIR on the type tier and centred by their box. The digit carries most of the ink, so
the mass leans ~5 px toward it. Composed the way the type tier composes (owner decision)."""

[[known]]
rule = "V-CENTRE"
where = "anim:verdict/padlock|unlock"
key = "centroid"
audit = "ICO-04"
reason = """the unlock preset RESTS OPEN — the shackle has sprung up and clear of the body,
so the open pose's mass sits right of and above the circle. The CLOSED rest, which the bare
padlock and its lock preset show, is what the centre law governs, and it passes."""

[[known]]
rule = "F-ELLIPSIS"
where = "flow:blind/typed_call/sign_with_args"
key = "0xaabbceff…8aabbccdd"
audit = "TY-02"
reason = """the bytes32 ARG 3 wears the DATA HASH fingerprint form under its own
label, which DESIGN.md does not sanction. Parked, not settled: ARG 0 of the SAME
flow is a comparable raw hash shown IN FULL over two lines, so the flow reads its
own argument values two ways. Decide which ARG 3 is — a fingerprint to match (keep
the shortening, and name it in DESIGN.md) or a value to verify (page it, as the
Safe TX HASH now does) — then delete this row."""
