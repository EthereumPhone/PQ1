<!DOCTYPE html>
<html>
<head>
<title>PQSigner WebHID Test — Protocol v2</title>
<style>
  body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; padding: 2em; }
  h2 { color: #0fbcf9; }
  button { margin: 4px; padding: 8px 16px; background: #0fbcf9; border: none; cursor: pointer; font-family: monospace; }
  button:disabled { background: #444; color: #888; cursor: not-allowed; }
  button:hover:not(:disabled) { background: #0dd; }
  #log { background: #0d0d1a; color: #0f0; padding: 1em; min-height: 400px; font-size: 13px; overflow-y: auto; max-height: 600px; white-space: pre-wrap; }
  .section { margin-top: 1em; border-top: 1px solid #333; padding-top: 0.5em; }
  .section-title { color: #0fbcf9; font-weight: bold; }
  input[type=text], input[type=number] { background: #0d0d1a; color: #0f0; border: 1px solid #333; padding: 4px 8px; font-family: monospace; width: 120px; }
  label { color: #888; font-size: 12px; }
</style>
</head>
<body>
<h2>PQSigner WebHID Test &mdash; Protocol v2 (CLA 0xF0)</h2>

<div>
  <button id="connect">Connect to PQSigner</button>
  <span id="status" style="color:#666">Not connected</span>
</div>

<div class="section">
  <span class="section-title">Device Info &amp; Status</span><br>
  <button id="getDeviceInfo" disabled>GET_DEVICE_INFO (0x01)</button>
  <button id="getStatus" disabled>GET_STATUS (0x02)</button>
</div>

<div class="section">
  <span class="section-title">Session</span><br>
  <button id="unlock" disabled>UNLOCK (0x10)</button>
  <button id="lock" disabled>LOCK (0x11)</button>
</div>

<div class="section">
  <span class="section-title">Key Queries</span><br>
  <button id="getBootstrapVk" disabled>GET_BOOTSTRAP_VK (0x20)</button>
  <button id="getMainVk" disabled>GET_MAIN_VK (0x21)</button>
  <label>Chain:</label> <input type="number" id="chainId" value="1">
  <label>Key idx:</label> <input type="number" id="keyIndex" value="0">
</div>

<div class="section">
  <span class="section-title">Signing</span><br>
  <button id="signUserOp" disabled>SIGN_USEROP (0x30) &mdash; test tx</button>
  <button id="signMessage" disabled>SIGN_MESSAGE (0x40) &mdash; test msg</button>
  <button id="signBootstrap" disabled>SIGN_BOOTSTRAP (0x50) &mdash; deploy</button>
</div>

<div class="section">
  <span class="section-title">Address</span><br>
  <button id="getWalletAddress" disabled>GET_WALLET_ADDRESS (0x60)</button>
  <label>Factory:</label> <input type="text" id="factory" value="0x0000000000000000000000000000000000000000" style="width:360px">
</div>

<pre id="log"></pre>

<script>
const VID = 0x1209;
const PID = 0x7051;
const REPORT_SIZE = 64;
const TAG_APDU = 0x05;

// v2 protocol
const CLA = 0xF0;

const INS_GET_DEVICE_INFO    = 0x01;
const INS_GET_STATUS         = 0x02;
const INS_UNLOCK             = 0x10;
const INS_LOCK               = 0x11;
const INS_GET_BOOTSTRAP_VK   = 0x20;
const INS_GET_MAIN_VK        = 0x21;
const INS_SIGN_USEROP        = 0x30;
const INS_SIGN_CLEAR_USEROP  = 0x31;
const INS_SIGN_MESSAGE       = 0x40;
const INS_SIGN_EIP712        = 0x41;
const INS_SIGN_BOOTSTRAP     = 0x50;
const INS_GET_WALLET_ADDRESS = 0x60;
const INS_GET_RESPONSE       = 0xC0;

// v2 chaining: P1 bit 7
const P1_LAST = 0x00;
const P1_MORE = 0x80;

let device = null;
let channelId = 0x0101;
const logEl = document.getElementById('log');

function log(msg) {
    logEl.textContent += msg + '\n';
    logEl.scrollTop = logEl.scrollHeight;
}

function hex(arr) {
    return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join(' ');
}

function hexCompact(arr) {
    return '0x' + Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
}

function u16be(hi, lo) { return (hi << 8) | lo; }
function u32be(a, b, c, d) { return ((a << 24) | (b << 16) | (c << 8) | d) >>> 0; }

// ---- HID Framing ----

function buildApdu(ins, p1, p2, data = new Uint8Array(0)) {
    const apdu = new Uint8Array(5 + data.length);
    apdu[0] = CLA;
    apdu[1] = ins;
    apdu[2] = p1;
    apdu[3] = p2;
    apdu[4] = data.length;
    apdu.set(data, 5);
    return apdu;
}

function frameApdu(apdu) {
    const frames = [];
    let offset = 0, seq = 0;

    const first = new Uint8Array(REPORT_SIZE);
    first[0] = (channelId >> 8) & 0xFF;
    first[1] = channelId & 0xFF;
    first[2] = TAG_APDU;
    first[3] = 0; first[4] = 0;
    first[5] = (apdu.length >> 8) & 0xFF;
    first[6] = apdu.length & 0xFF;
    const firstChunk = Math.min(57, apdu.length);
    first.set(apdu.subarray(0, firstChunk), 7);
    frames.push(first);
    offset = firstChunk;
    seq = 1;

    while (offset < apdu.length) {
        const frame = new Uint8Array(REPORT_SIZE);
        frame[0] = (channelId >> 8) & 0xFF;
        frame[1] = channelId & 0xFF;
        frame[2] = TAG_APDU;
        frame[3] = (seq >> 8) & 0xFF;
        frame[4] = seq & 0xFF;
        const chunk = Math.min(59, apdu.length - offset);
        frame.set(apdu.subarray(offset, offset + chunk), 5);
        frames.push(frame);
        offset += chunk;
        seq++;
    }
    return frames;
}

async function receiveHidApdu() {
    let buf = [];
    let expectedLen = 0;
    let seq = 0;

    while (true) {
        const report = await new Promise((resolve, reject) => {
            const timeout = setTimeout(() => reject(new Error('Timeout (120s)')), 120000);
            device.addEventListener('inputreport', (e) => {
                clearTimeout(timeout);
                resolve(new Uint8Array(e.data.buffer));
            }, { once: true });
        });

        const rTag = report[2];
        const rSeq = (report[3] << 8) | report[4];
        if (rTag !== TAG_APDU) continue;
        if (rSeq !== seq) { log(`ERROR: expected seq ${seq}, got ${rSeq}`); break; }

        if (seq === 0) {
            expectedLen = (report[5] << 8) | report[6];
            const chunk = Math.min(57, expectedLen);
            buf.push(...report.slice(7, 7 + chunk));
        } else {
            const remaining = expectedLen - buf.length;
            const chunk = Math.min(59, remaining);
            buf.push(...report.slice(5, 5 + chunk));
        }
        seq++;
        if (buf.length >= expectedLen) break;
    }
    return new Uint8Array(buf.slice(0, expectedLen));
}

// ---- APDU send with chaining + GET_RESPONSE ----

async function sendApdu(ins, p1, p2, data) {
    const apdu = buildApdu(ins, p1, p2, data);
    log(`>> [${apdu.length}B] CLA=${CLA.toString(16)} INS=${ins.toString(16)} P1=${p1.toString(16)} Lc=${data ? data.length : 0}`);

    for (const frame of frameApdu(apdu)) {
        await device.sendReport(0, frame);
    }

    let fullData = [];
    let response = await receiveHidApdu();

    while (true) {
        const sw1 = response[response.length - 2];
        const sw2 = response[response.length - 1];
        const sw = (sw1 << 8) | sw2;
        const payload = response.slice(0, response.length - 2);
        fullData.push(...payload);

        if (sw1 === 0x61) {
            if (fullData.length % 5000 < 253)
                log(`   ... ${fullData.length} bytes received, fetching more...`);
            const getResp = buildApdu(INS_GET_RESPONSE, 0, 0);
            for (const frame of frameApdu(getResp)) {
                await device.sendReport(0, frame);
            }
            response = await receiveHidApdu();
        } else {
            log(`<< SW=0x${sw.toString(16).padStart(4, '0')} Data[${fullData.length}B]`);
            return { sw, data: new Uint8Array(fullData) };
        }
    }
}

// Send large payload with command chaining (P1=0x80 for continuation, P1=0x00 for last)
async function sendChainedApdu(ins, payload) {
    const MAX_CHUNK = 255;
    let offset = 0;
    let fullData = [];

    while (offset < payload.length) {
        const remaining = payload.length - offset;
        const chunkLen = Math.min(MAX_CHUNK, remaining);
        const isLast = (offset + chunkLen >= payload.length) || (chunkLen < MAX_CHUNK);
        const p1 = (isLast) ? P1_LAST : P1_MORE;
        const chunk = payload.slice(offset, offset + chunkLen);

        const apdu = buildApdu(ins, p1, 0x00, chunk);
        for (const frame of frameApdu(apdu)) {
            await device.sendReport(0, frame);
        }
        const response = await receiveHidApdu();
        const sw1 = response[response.length - 2];
        const sw2 = response[response.length - 1];
        const sw = (sw1 << 8) | sw2;

        offset += chunkLen;

        if (isLast) {
            // This is the final response — may need GET_RESPONSE for large data
            const respPayload = response.slice(0, response.length - 2);
            fullData.push(...respPayload);

            if (sw1 === 0x61) {
                // Drain with GET_RESPONSE
                let more = true;
                while (more) {
                    if (fullData.length % 5000 < 253)
                        log(`   ... ${fullData.length} bytes received, fetching more...`);
                    const getResp = buildApdu(INS_GET_RESPONSE, 0, 0);
                    for (const frame of frameApdu(getResp)) {
                        await device.sendReport(0, frame);
                    }
                    const gr = await receiveHidApdu();
                    const gsw1 = gr[gr.length - 2];
                    const gsw2 = gr[gr.length - 1];
                    fullData.push(...gr.slice(0, gr.length - 2));
                    more = (gsw1 === 0x61);
                    if (!more) {
                        const finalSw = (gsw1 << 8) | gsw2;
                        log(`<< SW=0x${finalSw.toString(16).padStart(4, '0')} Data[${fullData.length}B]`);
                        return { sw: finalSw, data: new Uint8Array(fullData) };
                    }
                }
            }

            log(`<< SW=0x${sw.toString(16).padStart(4, '0')} Data[${fullData.length}B]`);
            return { sw, data: new Uint8Array(fullData) };
        } else {
            // Intermediate ACK — should be 0x9000
            if (sw !== 0x9000) {
                log(`   Chain error at offset ${offset}: SW=0x${sw.toString(16)}`);
                return { sw, data: new Uint8Array(0) };
            }
        }
    }
    return { sw: 0x6F00, data: new Uint8Array(0) };
}

// ---- Helpers ----

function parseWrapper(data) {
    if (data.length < 73) return null;
    return {
        signerType: data[0] === 0 ? 'MAIN' : 'BOOTSTRAP',
        keyIndex: u32be(data[1], data[2], data[3], data[4]),
        otsIndex: u32be(data[5], data[6], data[7], data[8]),
        pkSeed: data.slice(9, 41),
        pkRoot: data.slice(41, 73),
        sigLen: data.length - 73,
    };
}

function capBit(caps, bit) { return (caps & (1 << bit)) !== 0; }

// ---- Button Handlers ----

document.getElementById('connect').onclick = async () => {
    try {
        const devices = await navigator.hid.requestDevice({
            filters: [{ vendorId: VID, productId: PID }]
        });
        if (devices.length === 0) { log('No device selected'); return; }
        device = devices[0];
        await device.open();
        document.getElementById('status').textContent = `Connected: ${device.productName}`;
        document.getElementById('status').style.color = '#0f0';
        log(`Connected: ${device.productName} (VID 0x${device.vendorId.toString(16)}, PID 0x${device.productId.toString(16)})`);
        document.querySelectorAll('button:not(#connect)').forEach(b => b.disabled = false);
    } catch (e) { log(`Error: ${e.message}`); }
};

// GET_DEVICE_INFO
document.getElementById('getDeviceInfo').onclick = async () => {
    try {
        const { sw, data } = await sendApdu(INS_GET_DEVICE_INFO, 0, 0);
        if (sw === 0x9000 && data.length >= 40) {
            const protoVer = u16be(data[0], data[1]);
            log(`  Protocol:     v${(protoVer >> 8)}.${protoVer & 0xFF}`);
            log(`  Firmware:     ${data[2]}.${data[3]}.${data[4]}`);
            log(`  Device UID:   ${hex(data.slice(5, 21))}`);
            const caps = u32be(data[21], data[22], data[23], data[24]);
            log(`  Capabilities: 0x${caps.toString(16).padStart(8, '0')}`);
            log(`    UserOp:     ${capBit(caps, 0)}  ZK-ClearSign: ${capBit(caps, 1)}  EIP-712: ${capBit(caps, 2)}`);
            log(`    Message:    ${capBit(caps, 3)}  Bootstrap:    ${capBit(caps, 4)}  MultiChain: ${capBit(caps, 5)}`);
            log(`    CowSwap:    ${capBit(caps, 6)}  AddrVerify:   ${capBit(caps, 7)}`);
            log(`  Sig param:    ${data[25] === 0 ? 'SHA2-128f' : 'SHA2-192f'}`);
            const sigSize = u16be(data[26], data[27]);
            log(`  Sig size:     ${sigSize} bytes`);
            log(`  ERC20 DB:     ${u32be(data[28], data[29], data[30], data[31]).toString(16)}`);
            log(`  VK DB:        ${u32be(data[32], data[33], data[34], data[35]).toString(16)}`);
            const epVer = u16be(data[36], data[37]);
            log(`  EntryPoint:   v0.${epVer}`);
            const overhead = u16be(data[38], data[39]);
            log(`  Wrapper:      ${overhead} + ${sigSize} = ${overhead + sigSize} bytes total`);
        } else {
            log(`  Error: SW=0x${sw.toString(16)}`);
        }
    } catch (e) { log(`Error: ${e.message}`); }
};

// GET_STATUS
document.getElementById('getStatus').onclick = async () => {
    try {
        const { sw, data } = await sendApdu(INS_GET_STATUS, 0, 0);
        if (sw === 0x9000 && data.length >= 3) {
            log(`  Provisioned:  ${data[0] ? 'yes' : 'no'}`);
            log(`  Locked:       ${data[1] ? 'yes' : 'no'}`);
            log(`  PIN remaining: ${data[2]}`);
        } else {
            log(`  Error: SW=0x${sw.toString(16)}`);
        }
    } catch (e) { log(`Error: ${e.message}`); }
};

// UNLOCK
document.getElementById('unlock').onclick = async () => {
    try {
        log('  Waiting for PIN entry on device...');
        const { sw } = await sendApdu(INS_UNLOCK, 0, 0);
        log(`  Result: SW=0x${sw.toString(16).padStart(4, '0')} ${sw === 0x9000 ? '(unlocked)' : '(failed)'}`);
    } catch (e) { log(`Error: ${e.message}`); }
};

// LOCK
document.getElementById('lock').onclick = async () => {
    try {
        const { sw } = await sendApdu(INS_LOCK, 0, 0);
        log(`  Locked: SW=0x${sw.toString(16).padStart(4, '0')}`);
    } catch (e) { log(`Error: ${e.message}`); }
};

// GET_BOOTSTRAP_VK
document.getElementById('getBootstrapVk').onclick = async () => {
    try {
        const { sw, data } = await sendApdu(INS_GET_BOOTSTRAP_VK, 0, 0);
        if (sw === 0x9000 && data.length >= 32) {
            log(`  pk_seed: ${hex(data.slice(0, 16))}`);
            log(`  pk_root: ${hex(data.slice(16, 32))}`);
        } else {
            log(`  Error: SW=0x${sw.toString(16)}`);
        }
    } catch (e) { log(`Error: ${e.message}`); }
};

// GET_MAIN_VK
document.getElementById('getMainVk').onclick = async () => {
    try {
        const chainId = BigInt(document.getElementById('chainId').value);
        const keyIdx = parseInt(document.getElementById('keyIndex').value);
        const payload = new Uint8Array(12);
        // chain_id u64 BE
        for (let i = 0; i < 8; i++) payload[i] = Number((chainId >> BigInt((7 - i) * 8)) & 0xFFn);
        // key_index u32 BE
        payload[8] = (keyIdx >> 24) & 0xFF;
        payload[9] = (keyIdx >> 16) & 0xFF;
        payload[10] = (keyIdx >> 8) & 0xFF;
        payload[11] = keyIdx & 0xFF;

        log(`  Deriving VK for chain=${chainId}, key_index=${keyIdx}...`);
        const { sw, data } = await sendApdu(INS_GET_MAIN_VK, 0, 0, payload);
        if (sw === 0x9000 && data.length >= 32) {
            log(`  pk_seed: ${hex(data.slice(0, 16))}`);
            log(`  pk_root: ${hex(data.slice(16, 32))}`);
        } else {
            log(`  Error: SW=0x${sw.toString(16)}`);
        }
    } catch (e) { log(`Error: ${e.message}`); }
};

// SIGN_USEROP — test transaction (send 0.001 ETH on chain 1)
document.getElementById('signUserOp').onclick = async () => {
    try {
        const chainId = BigInt(document.getElementById('chainId').value);
        const keyIdx = parseInt(document.getElementById('keyIndex').value);

        // Unsigned EIP-1559 tx: send 0.001 ETH to 0xabcdef...
        const testTx = new Uint8Array([
            0x02, 0xf0, 0x01, 0x80, 0x84, 0x77, 0x35, 0x94, 0x00,
            0x85, 0x0b, 0xa4, 0x3b, 0x74, 0x00, 0x82, 0x52, 0x08,
            0x94, 0xab, 0xcd, 0xef, 0x12, 0x34, 0x56, 0x78, 0x9a,
            0xbc, 0xde, 0xf1, 0x23, 0x45, 0x67, 0x89, 0xab, 0xcd,
            0xef, 0x12, 0x34, 0x88, 0x0d, 0xe0, 0xb6, 0xb3, 0xa7,
            0x64, 0x00, 0x00, 0x80, 0xc0
        ]);

        // keccak256("")
        const keccakEmpty = new Uint8Array([
            0xc5, 0xd2, 0x46, 0x01, 0x86, 0xf7, 0x23, 0x3c, 0x92, 0x7e,
            0x7d, 0xb2, 0xdc, 0xc7, 0x03, 0xc0, 0xe5, 0x00, 0xb6, 0x53,
            0xca, 0x82, 0x27, 0x3b, 0x7b, 0xfa, 0xd8, 0x04, 0x5d, 0x85,
            0xa4, 0x70
        ]);

        // EntryPoint v0.6
        const entryPoint = new Uint8Array([
            0x5f, 0xf1, 0x37, 0xd4, 0xb0, 0xfd, 0xcd, 0x49, 0xdc, 0xa3,
            0x0c, 0x7c, 0xf5, 0x7e, 0x57, 0x8a, 0x02, 0x6d, 0x27, 0x89
        ]);

        // Build v2 SIGN_USEROP payload
        const txLen = testTx.length;
        const totalLen = 4 + 4 + 20 + 20 + 8 + 32*7 + 32*2 + 2 + txLen + 2;
        const payload = new Uint8Array(totalLen);
        let p = 0;

        // key_index u32 BE
        payload[p++] = (keyIdx >> 24) & 0xFF;
        payload[p++] = (keyIdx >> 16) & 0xFF;
        payload[p++] = (keyIdx >> 8) & 0xFF;
        payload[p++] = keyIdx & 0xFF;

        // ots_index u32 BE = 0
        p += 4;

        // sender (20 bytes zero = not yet deployed)
        p += 20;

        // entry_point
        payload.set(entryPoint, p); p += 20;

        // chain_id u64 BE
        for (let i = 0; i < 8; i++) payload[p++] = Number((chainId >> BigInt((7 - i) * 8)) & 0xFFn);

        // nonce (32 bytes, = 1)
        payload[p + 31] = 1; p += 32;

        // call_gas_limit = 100000
        payload[p + 29] = 0x01; payload[p + 30] = 0x86; payload[p + 31] = 0xa0; p += 32;

        // verification_gas_limit = 200000
        payload[p + 29] = 0x03; payload[p + 30] = 0x0d; payload[p + 31] = 0x40; p += 32;

        // pre_verification_gas = 21000
        payload[p + 30] = 0x52; payload[p + 31] = 0x08; p += 32;

        // max_fee_per_gas = 50 gwei
        const maxFee = BigInt(50_000_000_000);
        for (let i = 0; i < 8; i++) payload[p + 24 + i] = Number((maxFee >> BigInt((7 - i) * 8)) & 0xFFn);
        p += 32;

        // max_priority_fee_per_gas = 2 gwei
        const maxPrio = BigInt(2_000_000_000);
        for (let i = 0; i < 8; i++) payload[p + 24 + i] = Number((maxPrio >> BigInt((7 - i) * 8)) & 0xFFn);
        p += 32;

        // init_code_hash = keccak256("")
        payload.set(keccakEmpty, p); p += 32;

        // paymaster_and_data_hash = keccak256("")
        payload.set(keccakEmpty, p); p += 32;

        // tx_len u16 BE
        payload[p++] = (txLen >> 8) & 0xFF;
        payload[p++] = txLen & 0xFF;

        // tx data
        payload.set(testTx, p); p += txLen;

        // bundle_len = 0
        p += 2;

        log(`  Sending SIGN_USEROP (${p} bytes payload)...`);
        log(`  Confirm transaction on device display.`);

        const { sw, data } = await sendChainedApdu(INS_SIGN_USEROP, payload.slice(0, p));
        if (sw === 0x9000) {
            const w = parseWrapper(data);
            if (w) {
                log(`  PQSignatureWrapper received!`);
                log(`    signer:    ${w.signerType}`);
                log(`    keyIndex:  ${w.keyIndex}`);
                log(`    otsIndex:  ${w.otsIndex}`);
                log(`    pkSeed:    ${hex(w.pkSeed.slice(0, 16))}...`);
                log(`    pkRoot:    ${hex(w.pkRoot.slice(0, 16))}...`);
                log(`    sig size:  ${w.sigLen} bytes`);
                log(`    sig[0..32]: ${hex(data.slice(73, 105))}`);
            } else {
                log(`  Raw response: ${data.length} bytes`);
                log(`  First 64: ${hex(data.slice(0, 64))}`);
            }
        } else {
            log(`  Sign failed: SW=0x${sw.toString(16)}`);
        }
    } catch (e) { log(`Error: ${e.message}`); }
};

// SIGN_MESSAGE — test personal_sign
document.getElementById('signMessage').onclick = async () => {
    try {
        const chainId = BigInt(document.getElementById('chainId').value);
        const keyIdx = parseInt(document.getElementById('keyIndex').value);
        const msg = new TextEncoder().encode('Hello from PQSigner!');

        const payload = new Uint8Array(4 + 4 + 8 + 2 + msg.length);
        let p = 0;

        // key_index
        payload[p++] = (keyIdx >> 24) & 0xFF;
        payload[p++] = (keyIdx >> 16) & 0xFF;
        payload[p++] = (keyIdx >> 8) & 0xFF;
        payload[p++] = keyIdx & 0xFF;

        // ots_index = 0
        p += 4;

        // chain_id u64 BE
        for (let i = 0; i < 8; i++) payload[p++] = Number((chainId >> BigInt((7 - i) * 8)) & 0xFFn);

        // msg_len u16 BE
        payload[p++] = (msg.length >> 8) & 0xFF;
        payload[p++] = msg.length & 0xFF;

        // message
        payload.set(msg, p); p += msg.length;

        log(`  Sending SIGN_MESSAGE ("Hello from PQSigner!", ${p} bytes)...`);
        log(`  Confirm message on device display.`);

        const { sw, data } = await sendChainedApdu(INS_SIGN_MESSAGE, payload.slice(0, p));
        if (sw === 0x9000) {
            const w = parseWrapper(data);
            if (w) {
                log(`  PQSignatureWrapper received!`);
                log(`    signer:   ${w.signerType}`);
                log(`    sig size: ${w.sigLen} bytes`);
            } else {
                log(`  Response: ${data.length} bytes`);
            }
        } else {
            log(`  Sign failed: SW=0x${sw.toString(16)}`);
        }
    } catch (e) { log(`Error: ${e.message}`); }
};

// SIGN_BOOTSTRAP — deployment authorization
document.getElementById('signBootstrap').onclick = async () => {
    try {
        // Test: sign keccak256("PQWALLET_INIT_V1" + zeros) for deployment
        const payload = new Uint8Array(37);
        // ots_index = 0 (4 bytes)
        // context_tag = 0x00 (DEPLOY)
        payload[4] = 0x00;
        // msg_hash = all zeros (test)
        // bytes 5..37 already zero

        log('  Sending SIGN_BOOTSTRAP (deploy context, test hash)...');
        log('  Confirm "Deploy wallet?" on device display.');

        const { sw, data } = await sendChainedApdu(INS_SIGN_BOOTSTRAP, payload);
        if (sw === 0x9000) {
            const w = parseWrapper(data);
            if (w) {
                log(`  PQSignatureWrapper received!`);
                log(`    signer:   ${w.signerType} (expected BOOTSTRAP)`);
                log(`    sig size: ${w.sigLen} bytes`);
            }
        } else {
            log(`  Sign failed: SW=0x${sw.toString(16)}`);
        }
    } catch (e) { log(`Error: ${e.message}`); }
};

// GET_WALLET_ADDRESS
document.getElementById('getWalletAddress').onclick = async () => {
    try {
        const chainId = BigInt(document.getElementById('chainId').value);
        const factoryHex = document.getElementById('factory').value.replace('0x', '');

        const payload = new Uint8Array(60);
        let p = 0;

        // chain_id u64 BE
        for (let i = 0; i < 8; i++) payload[p++] = Number((chainId >> BigInt((7 - i) * 8)) & 0xFFn);

        // factory_address (20 bytes)
        for (let i = 0; i < 20; i++) {
            payload[p++] = parseInt(factoryHex.substr(i * 2, 2), 16) || 0;
        }

        // init_code_hash (32 bytes) — placeholder zeros
        p += 32;

        log(`  Requesting wallet address for chain ${chainId}...`);
        log(`  Verify address on device display.`);

        const { sw, data } = await sendApdu(INS_GET_WALLET_ADDRESS, 0, 0, payload);
        if (sw === 0x9000 && data.length >= 20) {
            log(`  Address: ${hexCompact(data.slice(0, 20))}`);
        } else {
            log(`  Error: SW=0x${sw.toString(16)}`);
        }
    } catch (e) { log(`Error: ${e.message}`); }
};
</script>
