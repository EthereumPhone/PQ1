# Standalone workspace — detached from the PQSigner workspace.
# Path-deps `sphincs-tz-shared` (which re-exports the NS_*_BASE / END +
# SHARED_MAILBOX_* constants from `pqsigner-proto`). Both no_std and build on
# thumbv8m. The `#[path]`-included `secure/src/nsc/ptr_validate.rs` is the
# real validator — bit-equivalent to production.
[workspace]

[package]
name = "sca-ns-ptr-target"
version = "0.1.0"
edition = "2021"
publish = false
description = "thumbv8m ELF wrapping the real `secure::nsc::ptr_validate::validate_ns_{read,write}_ptr` (no stubs), driven by tools/sca/fault_sweep_ns_ptr.py. Sweeps the TrustZone-boundary NS-pointer validation predicates for single-fault bypasses (the classic FI attack: skip a bounds check and an NS-supplied pointer aliases into secure RAM)."

[[bin]]
name = "sca-ns-ptr-target"
path = "src/main.rs"

[dependencies]
cortex-m    = "0.7"
cortex-m-rt = "0.7"
panic-halt  = "1"
# Required by the `#[path]`-included `secure/src/fi.rs` (sentinel zeroize).
zeroize     = { version = "1", default-features = false }
# Provides NS_SRAM_BASE/END, NS_FLASH_BASE/END, SHARED_MAILBOX_BASE/END via
# its re-export of pqsigner-proto. Without the `stm32u585` feature it picks
# the QEMU mps2-an505 layout; the validation logic is identical either way.
sphincs-tz-shared = { path = "../../../shared" }

[profile.release]
opt-level = 3            # keep emulation fast; do NOT strip (rainbow needs .symtab)
