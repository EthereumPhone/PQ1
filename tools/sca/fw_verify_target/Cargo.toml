# Standalone workspace — detached from the PQSigner workspace (its own profile;
# not built by a root `cargo build`). Path-deps `fw-manifest` + `sphincs-c10`
# directly; their `{ workspace = true }` deps (`zeroize`, `sha2`) are resolved
# from each crate's own workspace (the repo root's `[workspace.dependencies]`),
# so the path-deps work even though this crate is its own workspace.
[workspace]

[package]
name = "sca-fw-verify-target"
version = "0.1.0"
edition = "2021"
publish = false
description = "thumbv8m ELF wrapping fw_manifest::ManifestRef::verify_* (real, not stubbed) — driven by tools/sca/fault_sweep_fw_verify.py. Mirrors the FSBL's manifest-verify chain so the FI sweep checks 'can a single skip convert Err→Ok on a known-bad manifest?'. Not shipped."

[[bin]]
name = "sca-fw-verify-target"
path = "src/main.rs"

[dependencies]
cortex-m    = "0.7"
cortex-m-rt = "0.7"
panic-halt  = "1"
# The real verifier — software SHA-256 path. Both crates are no_std and build
# unchanged on thumbv8m.
fw-manifest = { path = "../../../fw-manifest" }
sphincs-c10 = { path = "../../../sphincs-c10" }

[build-dependencies]
# build.rs runs on the host but exercises the same no_std crates. Determinism:
# vendor keypair derived from a fixed sk_seed, so the fixtures are bit-stable
# across machines and across cargo rebuilds.
fw-manifest = { path = "../../../fw-manifest" }
sphincs-c10 = { path = "../../../sphincs-c10" }
sha2 = "0.10"

[profile.release]
opt-level = 3            # keep emulation fast; do NOT strip (rainbow needs .symtab)

[profile.release.package.sphincs-c10]
opt-level = 3

[profile.release.package.sha2]
opt-level = 3
