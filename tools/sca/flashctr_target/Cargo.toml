[workspace]

[package]
name = "sca-flashctr-target"
version = "0.1.0"
edition = "2021"
publish = false
description = "thumbv8m ELF mirroring the log-structured off-chain counter SCAN logic from secure/src/hw/flash.rs (offchain_count_read + parse_entry). Page lives in RAM here; the scan code is bit-identical to production. Tests whether a single fault on the scan loop can cause a rollback attack — return a value LOWER than the actual maximum in flash, letting the firmware think the counter is lower than it is."

[[bin]]
name = "sca-flashctr-target"
path = "src/main.rs"

[dependencies]
cortex-m    = "0.7"
cortex-m-rt = "0.7"
panic-halt  = "1"
zeroize     = { version = "1", default-features = false }
pqsigner-fi = { path = "../../../pqsigner-fi" }

[profile.release]
opt-level = 3
