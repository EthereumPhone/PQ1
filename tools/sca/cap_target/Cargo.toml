# Standalone workspace — detached from the PQSigner workspace.
# Mirrors the off-chain gap + cap enforcement gates from
# `secure/src/nsc/cmd_sign_offchain.rs` so we can fault-sweep them
# without dragging in the secure crate.
[workspace]

[package]
name = "sca-cap-target"
version = "0.1.0"
edition = "2021"
publish = false
description = "thumbv8m ELF wrapping the off-chain gap + combined-cap enforcement predicates that gate every CMD_SIGN_OFFCHAIN call. Tests whether a single fault can bypass the 65 k-sig invariant (slotUses + offchainSigCount < MAX_SLOT_USES = 65_536) or the unbacked-gap invariant (gap < MAX_OFFCHAIN_GAP = 100)."

[[bin]]
name = "sca-cap-target"
path = "src/main.rs"

[dependencies]
cortex-m    = "0.7"
cortex-m-rt = "0.7"
panic-halt  = "1"
# Required by the `#[path]`-included `secure/src/fi.rs` (sentinel zeroize).
zeroize     = { version = "1", default-features = false }
# Shared FI primitives — secure/fi.rs is a thin shim over this.
pqsigner-fi = { path = "../../../pqsigner-fi" }

[profile.release]
opt-level = 3
