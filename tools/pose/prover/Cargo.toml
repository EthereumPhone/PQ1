[workspace]

[package]
name = "pose-prover"
version = "0.1.0"
edition = "2021"
publish = false
description = "PQ1 proof-of-secure-erasure prover (EVT experiment). Lives in bank-1 page 0.., boots at SECBOOTADD0, and over USB HID lets a host fill every flash byte outside its own pages with random data and read all of flash back. See docs/security/user-device-verification.md § USB path."

[[bin]]
name = "pose-prover"
path = "src/main.rs"
test = false
bench = false

[features]
# Negative controls. Each one is a deliberately dishonest prover that the
# host verifier must catch.
cheat-skip-page = []  # never programs one bank-2 page
cheat-ram-hold = []   # keeps the last 64 KiB of flash data in SRAM3 instead

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "1"
usb-device = { version = "0.3", default-features = false }
synopsys-usb-otg = { version = "0.4", features = ["cortex-m", "fs"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = true
panic = "abort"
